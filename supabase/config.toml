# Function-specific auth boundary: this handler verifies GitHub Actions OIDC
# signatures, issuer, audience, repository, workflow, ref, event and runner itself.
# Supabase gateway JWT validation must be disabled only for this function.
[functions.midad_browser_agent_gateway]
verify_jwt = false

# The Memory Gateway uses a custom opaque Control Room session token, hashes it,
# and validates the owner-bound session row inside the handler. No Supabase JWT
# is accepted as a substitute; the function remains default-off at application level.
[functions.midad_memory_gateway]
verify_jwt = false
