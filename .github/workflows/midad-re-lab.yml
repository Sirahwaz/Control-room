name: MIDAD Reverse Engineering Lab
on:
  workflow_dispatch:
    inputs:
      target_url:
        description: "Authorized public HTTPS website to inspect (read-only, same-host only)"
        required: false
        type: string
      apk_url:
        description: "Direct HTTPS URL to an APK you own or are authorized to analyze"
        required: false
        type: string
permissions:
  contents: read
jobs:
  web-surface:
    if: ${{ inputs.target_url != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install browser runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Read-only web surface analysis
        run: python tools/midad-re-lab/analyze_web.py --url "${{ inputs.target_url }}" --out artifacts/web
      - uses: actions/upload-artifact@v4
        with:
          name: midad-web-surface-report
          path: artifacts/web/web-surface-report.json
          if-no-files-found: error
          retention-days: 14
  android-static:
    if: ${{ inputs.apk_url != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned JADX and Apktool
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip
          curl -fsSL https://github.com/skylot/jadx/releases/download/v1.5.1/jadx-1.5.1.zip -o /tmp/jadx.zip
          unzip -q /tmp/jadx.zip -d /opt/jadx
          sudo chmod +x /opt/jadx/bin/jadx
          curl -fsSL https://raw.githubusercontent.com/iBotPeaches/Apktool/v2.11.1/scripts/linux/apktool -o /usr/local/bin/apktool
          curl -fsSL https://github.com/iBotPeaches/Apktool/releases/download/v2.11.1/apktool_2.11.1.jar -o /usr/local/bin/apktool.jar
          sudo chmod +x /usr/local/bin/apktool
      - name: Static APK analysis
        run: python tools/midad-re-lab/analyze_apk.py --url "${{ inputs.apk_url }}" --jadx /opt/jadx/bin/jadx --apktool /usr/local/bin/apktool.jar --out artifacts/apk
      - uses: actions/upload-artifact@v4
        with:
          name: midad-android-static-report
          path: artifacts/apk/android-static-report.json
          if-no-files-found: error
          retention-days: 14
