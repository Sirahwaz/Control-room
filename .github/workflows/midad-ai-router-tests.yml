name: MIDAD AI Router Public Route Policy Tests
on:
  pull_request:
    paths:
      - "supabase/functions/midad_ai_router/**"
      - ".github/workflows/midad-ai-router-tests.yml"
  push:
    branches: [main]
    paths:
      - "supabase/functions/midad_ai_router/**"
      - ".github/workflows/midad-ai-router-tests.yml"
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Public route policy contract tests
        run: node --test supabase/functions/midad_ai_router/public-routing-policy.test.mjs supabase/functions/midad_ai_router/fallback-policy.test.mjs supabase/functions/midad_ai_router/auth-policy.test.mjs
      - name: AI Router type check
        run: deno check supabase/functions/midad_ai_router/index.ts
