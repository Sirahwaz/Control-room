name: MIDAD Continuity — Cloudflare Deploy

on:
  push:
    branches: [main]
    paths:
      - "mobile/factory/x/continuity-ledger/**"
      - "mobile/factory/x/ephemeral-runner.mjs"
      - ".github/workflows/midad-continuity-cloudflare-deploy.yml"
      - ".github/workflows/midad-mncf-ephemeral-runner.yml"
      - ".github/workflows/midad-mncf-enroll-cpu-runner.yml"
      - "mobile/factory/x/tests/continuity-github-oidc.test.mjs"
      - "mobile/factory/x/tests/continuity-runner-enrollment-workflow.test.mjs"
  pull_request:
    branches: [main]
    paths:
      - "mobile/factory/x/continuity-ledger/**"
      - "mobile/factory/x/ephemeral-runner.mjs"
      - "mobile/factory/x/tests/continuity-github-oidc.test.mjs"
      - ".github/workflows/midad-continuity-cloudflare-deploy.yml"
      - ".github/workflows/midad-mncf-enroll-cpu-runner.yml"
      - "mobile/factory/x/tests/continuity-runner-enrollment-workflow.test.mjs"
  workflow_dispatch:
    inputs:
      operation:
        description: "Dry-run validates only. Deploy provisions Queues and publishes the Worker."
        required: true
        type: choice
        options:
          - dry-run
          - deploy
        default: dry-run
      confirmation:
        description: "Type DEPLOY only when intentionally publishing the Worker."
        required: false
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: midad-continuity-cloudflare-deploy
  cancel-in-progress: false

jobs:
  pull-request-dry-run:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: mobile/factory/x/continuity-ledger
    steps:
      - name: Checkout pull request
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Run Cloudflare Browser Run runtime contract tests
        run: node --test ../tests/browser-run-runtime.test.mjs
      - name: Run Continuity, Vault, Browser Run, GitHub dispatch, enrollment and deploy workflow contract tests
        run: node --test ../tests/continuity-ledger.test.mjs ../tests/continuity-wake.test.mjs ../tests/continuity-vault.test.mjs ../tests/browser-run-runtime.test.mjs ../tests/continuity-github-dispatch.test.mjs ../tests/continuity-deploy-workflow.test.mjs ../tests/continuity-runner-enrollment-workflow.test.mjs ../tests/continuity-github-oidc.test.mjs
      - name: Validate Cloudflare Worker bundle without credentials or deployment
        run: npx --yes wrangler@4.102.0 deploy --dry-run --outdir "$RUNNER_TEMP/midad-continuity-ledger-pr-dry-run"

  dry-run:
    if: inputs.operation == 'dry-run'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: mobile/factory/x/continuity-ledger
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Validate Worker bundle without credentials or deployment
        run: npx --yes wrangler@4.102.0 deploy --dry-run --outdir "$RUNNER_TEMP/midad-continuity-ledger-dry-run"

  deploy:
    if: inputs.operation == 'deploy' || github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: cloudflare-production
    timeout-minutes: 20
    defaults:
      run:
        working-directory: mobile/factory/x/continuity-ledger
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      MIDAD_LEDGER_ADMIN_KEY: ${{ secrets.MIDAD_LEDGER_ADMIN_KEY }}
      MIDAD_WAKE_INTERNAL_KEY: ${{ secrets.MIDAD_WAKE_INTERNAL_KEY }}
      MIDAD_VAULT_KEYRING_JSON: ${{ secrets.MIDAD_VAULT_KEYRING_JSON }}
      MIDAD_VAULT_ACTIVE_KEY_VERSION: ${{ secrets.MIDAD_VAULT_ACTIVE_KEY_VERSION }}
      MIDAD_GITHUB_APP_ID: ${{ secrets.MIDAD_GITHUB_APP_ID }}
      MIDAD_GITHUB_INSTALLATION_ID: ${{ secrets.MIDAD_GITHUB_INSTALLATION_ID }}
      MIDAD_GITHUB_APP_PRIVATE_KEY: ${{ secrets.MIDAD_GITHUB_APP_PRIVATE_KEY }}
      DEPLOY_CONFIRMATION: ${{ inputs.confirmation }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Require explicit main-branch deployment approval and secrets
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "::error::Deployment is allowed only from refs/heads/main after PR review and merge."
            exit 1
          fi
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" && "$DEPLOY_CONFIRMATION" != "DEPLOY" ]]; then
            echo "::error::Type DEPLOY in the confirmation input to authorize publication."
            exit 1
          fi
          if [[ "$GITHUB_EVENT_NAME" != "push" && "$GITHUB_EVENT_NAME" != "workflow_dispatch" ]]; then
            echo "::error::Unsupported deployment event."
            exit 1
          fi
          if [[ -z "$CLOUDFLARE_API_TOKEN" || -z "$CLOUDFLARE_ACCOUNT_ID" ||
                -z "$MIDAD_LEDGER_ADMIN_KEY" || -z "$MIDAD_WAKE_INTERNAL_KEY" ||
                -z "$MIDAD_VAULT_KEYRING_JSON" || -z "$MIDAD_VAULT_ACTIVE_KEY_VERSION" ]]; then
            echo "::error::One or more required cloudflare-production environment secrets are missing."
            exit 1
          fi
          if [[ "${#MIDAD_LEDGER_ADMIN_KEY}" -lt 32 || "${#MIDAD_WAKE_INTERNAL_KEY}" -lt 32 ]]; then
            echo "::error::MIDAD worker secrets must each contain at least 32 characters."
            exit 1
          fi
          node --input-type=module - <<'NODE'
          import { readVaultKeyring } from './vault-crypto.mjs';
          const keyring = readVaultKeyring(process.env);
          console.log(JSON.stringify({
            vault_keyring_valid: true,
            active_key_version: keyring.activeVersion,
            key_versions: keyring.keys.size,
          }));
          NODE
          APP_SECRET_COUNT=0
          for value in "$MIDAD_GITHUB_APP_ID" "$MIDAD_GITHUB_INSTALLATION_ID" "$MIDAD_GITHUB_APP_PRIVATE_KEY"; do
            if [[ -n "$value" ]]; then APP_SECRET_COUNT=$((APP_SECRET_COUNT + 1)); fi
          done
          if [[ "$APP_SECRET_COUNT" -ne 0 && "$APP_SECRET_COUNT" -ne 3 ]]; then
            echo "::error::GitHub App dispatch requires all three MIDAD_GITHUB_APP_* secrets or none."
            exit 1
          fi
          if [[ -n "$MIDAD_GITHUB_APP_ID" && ( ! "$MIDAD_GITHUB_APP_ID" =~ ^[0-9]{1,20}$ || ! "$MIDAD_GITHUB_INSTALLATION_ID" =~ ^[0-9]{1,20}$ ) ]]; then
            echo "::error::GitHub App and installation identifiers must be numeric."
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Create missing Cloudflare Queues (idempotent)
        shell: bash
        run: |
          set -euo pipefail
          for queue in midad-continuity-wake midad-continuity-wake-dlq; do
            if npx --yes wrangler@4.102.0 queues info "$queue" >/dev/null 2>&1; then
              echo "Queue already exists: $queue"
            else
              echo "Creating Queue: $queue"
              npx --yes wrangler@4.102.0 queues create "$queue"
            fi
          done

      - name: Deploy Durable Object Worker and Queue bindings
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4.102.0 deploy 2>&1 | tee "$RUNNER_TEMP/midad-continuity-deploy.log"

      - name: Set Worker secrets without printing or committing values
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          SECRET_FILE="$RUNNER_TEMP/midad-continuity-worker-secrets.json"
          node - "$SECRET_FILE" <<'NODE'
          const fs = require('node:fs');
          const target = process.argv[2];
          const values = {
            MIDAD_LEDGER_ADMIN_KEY: process.env.MIDAD_LEDGER_ADMIN_KEY,
            MIDAD_WAKE_INTERNAL_KEY: process.env.MIDAD_WAKE_INTERNAL_KEY,
            MIDAD_VAULT_KEYRING_JSON: process.env.MIDAD_VAULT_KEYRING_JSON,
            MIDAD_VAULT_ACTIVE_KEY_VERSION: process.env.MIDAD_VAULT_ACTIVE_KEY_VERSION,
          };
          if (typeof values.MIDAD_LEDGER_ADMIN_KEY !== 'string' || values.MIDAD_LEDGER_ADMIN_KEY.length < 32 ||
              typeof values.MIDAD_WAKE_INTERNAL_KEY !== 'string' || values.MIDAD_WAKE_INTERNAL_KEY.length < 32 ||
              typeof values.MIDAD_VAULT_KEYRING_JSON !== 'string' || values.MIDAD_VAULT_KEYRING_JSON.length === 0 ||
              typeof values.MIDAD_VAULT_ACTIVE_KEY_VERSION !== 'string' || values.MIDAD_VAULT_ACTIVE_KEY_VERSION.length === 0) {
            throw new Error('Worker secret validation failed');
          }
          const appValues = {
            MIDAD_GITHUB_APP_ID: process.env.MIDAD_GITHUB_APP_ID,
            MIDAD_GITHUB_INSTALLATION_ID: process.env.MIDAD_GITHUB_INSTALLATION_ID,
            MIDAD_GITHUB_APP_PRIVATE_KEY: process.env.MIDAD_GITHUB_APP_PRIVATE_KEY,
          };
          const appPresent = Object.values(appValues).filter(value => typeof value === 'string' && value.length > 0).length;
          if (appPresent !== 0 && appPresent !== 3) throw new Error('GitHub App dispatch configuration is incomplete');
          if (appPresent === 3) Object.assign(values, appValues);
          fs.writeFileSync(target, JSON.stringify(values), { mode: 0o600 });
          NODE
          npx --yes wrangler@4.102.0 secret bulk "$SECRET_FILE" --name midad-continuity-ledger
          rm -f "$SECRET_FILE"

      - name: Verify public Worker health endpoint
        shell: bash
        run: |
          set -euo pipefail
          WORKER_URL="$(grep -Eo 'https://[A-Za-z0-9.-]+\.workers\.dev' "$RUNNER_TEMP/midad-continuity-deploy.log" | tail -n 1 || true)"
          if [[ -z "$WORKER_URL" ]]; then
            echo "::error::Wrangler did not report a workers.dev URL; inspect the deployment output before marking this deploy verified."
            exit 1
          fi
          HEALTH_FILE="$RUNNER_TEMP/midad-continuity-health.json"
          WORKER_HEALTHY=0
          HTTP_STATUS="000"
          # Cloudflare Durable Object class updates may propagate after the Worker script deploy.
          # Require the exact policy marker from the DO code, not only the pre-existing auth marker.
          for attempt in $(seq 1 85); do
            HTTP_STATUS="$(curl --silent --show-error --output "$HEALTH_FILE" --write-out '%{http_code}' --max-time 5 "$WORKER_URL/health" || true)"
            if [[ "$HTTP_STATUS" == "200" ]] && node - "$HEALTH_FILE" <<'NODE'
          const fs = require('node:fs');
          try {
            const health = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
            process.exit(
              health.ok === true &&
              health.service === 'midad-continuity-ledger' &&
              health.node_auth === 'github-actions-oidc-v1' &&
              health.oidc_subject_policy === 'legacy-and-immutable-v4-jwks-network'
                ? 0 : 1
            );
          } catch {
            process.exit(1);
          }
          NODE
            then
              WORKER_HEALTHY=1
              break
            fi
            echo "Worker/DO policy rollout pending (attempt $attempt/85, HTTP ${HTTP_STATUS:-000}); waiting for propagation."
            sleep 4
          done
          if [[ "$WORKER_HEALTHY" -ne 1 ]]; then
            echo "::error::Worker/DO policy marker did not become healthy after 85 attempts; last status ${HTTP_STATUS:-000}."
            exit 1
          fi
          cat "$HEALTH_FILE"
          node - "$HEALTH_FILE" <<'NODE'
          const fs = require('node:fs');
          const health = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          if (health.ok !== true || health.service !== 'midad-continuity-ledger' ||
              health.node_auth !== 'github-actions-oidc-v1' ||
              health.oidc_subject_policy !== 'legacy-and-immutable-v4-jwks-network') {
            throw new Error('Continuity Worker health response is invalid or lacks the GitHub OIDC CPU runner auth mode');
          }
          console.log(JSON.stringify({
            ok: health.ok,
            service: health.service,
            schema: health.schema,
            dispatch: health.dispatch,
            node_auth: health.node_auth,
            oidc_subject_policy: health.oidc_subject_policy,
          }));
          NODE
