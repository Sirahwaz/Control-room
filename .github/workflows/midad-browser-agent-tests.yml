name: MIDAD Free Browser Agent — Tests
on:
  push:
    branches:
      - midad/free-browser-agent-v1
    paths:
      - "tools/midad-browser-agent/**"
      - ".github/workflows/midad-browser-agent-tests.yml"
  pull_request:
    paths:
      - "tools/midad-browser-agent/**"
      - ".github/workflows/midad-browser-agent-tests.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install browser runtime
        run: |
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install --with-deps chromium
      - name: Run unit tests
        working-directory: tools/midad-browser-agent
        run: python -m unittest -v
