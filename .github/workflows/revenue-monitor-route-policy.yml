name: Revenue monitor route policy

on:
  pull_request:
    paths:
      - "supabase/functions/midad_wallet_receipt_monitor/**"
      - "supabase/functions/midad_multichain_usdt_monitor/**"
      - "supabase/functions/_tests/receipt-monitor-route-policy.test.ts"
      - ".github/workflows/revenue-monitor-route-policy.yml"
  push:
    branches: [main]
    paths:
      - "supabase/functions/midad_wallet_receipt_monitor/**"
      - "supabase/functions/midad_multichain_usdt_monitor/**"
      - "supabase/functions/_tests/receipt-monitor-route-policy.test.ts"
      - ".github/workflows/revenue-monitor-route-policy.yml"

permissions:
  contents: read

jobs:
  monitor-route-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Format policy and tests
        run: deno fmt --check supabase/functions/midad_wallet_receipt_monitor/route-policy.ts supabase/functions/midad_multichain_usdt_monitor/route-policy.ts supabase/functions/_tests/receipt-monitor-route-policy.test.ts
      - name: Focused monitor route tests
        run: deno test supabase/functions/_tests/receipt-monitor-route-policy.test.ts
      - name: Type-check Solana receipt monitor
        run: deno check supabase/functions/midad_wallet_receipt_monitor/index.ts
      - name: Type-check EVM USDT monitor
        run: deno check supabase/functions/midad_multichain_usdt_monitor/index.ts
