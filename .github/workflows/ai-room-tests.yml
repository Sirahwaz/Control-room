name: MIDAD AI Room static contract tests

on:
  pull_request:
    branches: [main]
    paths:
      - "ai-room.html"
      - "tests/ai-room-static.test.mjs"
      - ".github/workflows/ai-room-tests.yml"
  push:
    branches:
      - "feat/midad-ai-room-neuralpp-20261024"
    paths:
      - "ai-room.html"
      - "tests/ai-room-static.test.mjs"
      - ".github/workflows/ai-room-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ai-room-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-contract:
    name: AI Room static contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Run built-in Node.js tests
        run: node --test tests/ai-room-static.test.mjs
