name: MIDAD Mobile Factory X

on:
  push:
    branches:
      - factory/mobile-factory-x
      - main
    paths:
      - 'mobile/factory/x/**'
      - '.github/workflows/mobile-factory-x.yml'
  pull_request:
    paths:
      - 'mobile/factory/x/**'
      - '.github/workflows/mobile-factory-x.yml'
  workflow_dispatch:

jobs:
  factory-x-self-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore Factory X cache
        uses: actions/cache@v4
        with:
          path: .factory-cache
          key: factory-x-cache-${{ runner.os }}-${{ hashFiles('mobile/factory/x/*.json') }}
          restore-keys: |
            factory-x-cache-${{ runner.os }}-

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: JSON registry parse
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const files = [
            'mobile/factory/x/factory-x.config.json',
            'mobile/factory/x/factory-x.config.schema.json',
            'mobile/factory/x/capabilities.registry.json',
            'mobile/factory/x/providers.registry.json',
            'mobile/factory/x/plugins.registry.json',
            'mobile/factory/x/agents.registry.json',
            'mobile/factory/x/automations.registry.json',
            'mobile/factory/x/selection.policy.json',
            'mobile/factory/x/examples/factory-x-self-test.request.json',
            'mobile/factory/x/examples/factory-x-execution.request.json'
          ];
          for (const f of files) {
            JSON.parse(fs.readFileSync(f, 'utf8'));
            console.log('JSON OK', f);
          }
          NODE

      - name: JavaScript syntax
        run: |
          node --check mobile/factory/x/plan.mjs
          node --check mobile/factory/x/preflight.mjs
          node --check mobile/factory/x/execution-engine.mjs

      - name: Factory X preflight
        run: node mobile/factory/x/preflight.mjs

      - name: Factory X planning
        run: node mobile/factory/x/plan.mjs mobile/factory/x/examples/factory-x-self-test.request.json

      - name: Factory X execution engine
        run: node mobile/factory/x/execution-engine.mjs mobile/factory/x/examples/factory-x-execution.request.json --no-cache

      - name: Factory X cache reuse
        run: node mobile/factory/x/execution-engine.mjs mobile/factory/x/examples/factory-x-execution.request.json

      - name: Assert parallelism and registries
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const cfg=JSON.parse(fs.readFileSync('mobile/factory/x/factory-x.config.json'));
          const agents=JSON.parse(fs.readFileSync('mobile/factory/x/agents.registry.json')).agents;
          const autos=JSON.parse(fs.readFileSync('mobile/factory/x/automations.registry.json')).automations;
          const providers=JSON.parse(fs.readFileSync('mobile/factory/x/providers.registry.json')).providers;
          if(cfg.execution.max_parallel_agents < 20) throw new Error('parallel agent capacity too low');
          if(cfg.execution.max_parallel_tasks < 40) throw new Error('parallel task capacity too low');
          if(agents.length < 20) throw new Error('agent registry incomplete');
          if(autos.length < 7) throw new Error('automation registry incomplete');
          if(!providers.some(p=>p.status==='discover_on_need')) throw new Error('provider discovery path missing');
          console.log(JSON.stringify({
            ok:true,
            max_parallel_agents:cfg.execution.max_parallel_agents,
            max_parallel_tasks:cfg.execution.max_parallel_tasks,
            agents:agents.length,
            automations:autos.length,
            providers:providers.length
          }));
          NODE

      - name: Execution report assertions
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const r=JSON.parse(fs.readFileSync('mobile/factory/x/execution-report.json'));
          if(!r.ok) throw new Error('execution report not ok');
          if(r.state!=='PLANNED_EXECUTION_VERIFIED') throw new Error('execution state invalid');
          if(r.counts.tasks < 20) throw new Error('DAG task count too low');
          if(r.counts.completed < 20 && r.counts.cached < 20) throw new Error('DAG did not complete');
          if(r.counts.cached < 20) throw new Error('cache reuse not verified: expected at least 20 cached tasks');
          if(r.parallelism.max_parallel_tasks < 40) throw new Error('parallel task capacity not preserved');
          console.log(JSON.stringify({ok:true,state:r.state,tasks:r.counts.tasks,completed:r.counts.completed,cached:r.counts.cached,discovery:r.discovery_queue.length}));
          NODE

      - name: Security text scan
        run: |
          if grep -RInE --exclude-dir=.git --exclude='*.lock'             'BEGIN (RSA|OPENSSH|PRIVATE) KEY|SUPABASE_SERVICE_ROLE_KEY|sk-[A-Za-z0-9_-]{20,}|AIza[0-9A-Za-z_-]{20,}'             mobile/factory/x; then
            echo "Potential secret pattern found"
            exit 1
          fi
          echo "Security scan PASS"
