name: MIDAD Micro Calendar Adapter Contract

on:
  pull_request:
    paths:
      - "supabase/functions/midad_micro_calendar_adapter/**"
      - ".github/workflows/midad-micro-calendar-adapter.yml"
  push:
    branches: [main]
    paths:
      - "supabase/functions/midad_micro_calendar_adapter/**"
      - ".github/workflows/midad-micro-calendar-adapter.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Run offline adapter contract tests
        run: node --test supabase/functions/midad_micro_calendar_adapter/adapter.test.mjs
      - name: Type-check Supabase Edge Function
        run: deno check supabase/functions/midad_micro_calendar_adapter/index.ts
