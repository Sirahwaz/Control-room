name: SignalScan AI Android
on:
  push:
    branches: ["main","factory-certification-v1"]
    paths:
      - "mobile/factory/products/signalscan-ai.json"
      - "mobile/web/signalscan/**"
      - ".github/workflows/signalscan-ai-android.yml"
  workflow_dispatch:
    inputs:
      customer_delivery:
        description: "Request customer-delivery certification (requires production channel and signing)"
        required: true
        default: false
        type: boolean
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node 24
        uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Resolve SignalScan factory product
        shell: bash
        run: |
          set -euo pipefail
          node mobile/factory/render.mjs signalscan-ai
          jq -e '.product_key=="signalscan-ai"' mobile/factory/runtime-product.json >/dev/null
          jq -e '.features.server_side_secrets_only==true' mobile/factory/runtime-product.json >/dev/null
      - name: Setup Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - name: Prepare Android SDK
        shell: bash
        run: |
          set -euo pipefail
          ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
      - name: Install Capacitor dependencies
        working-directory: mobile
        run: npm install --no-fund --no-audit
      - name: Prepare SignalScan web surface
        shell: bash
        run: |
          set -euo pipefail
          rm -rf mobile/www
          mkdir -p mobile/www
          cp mobile/web/signalscan/index.html mobile/www/index.html
          cp mobile/web/signalscan/signalscan.css mobile/www/signalscan.css
          cp mobile/web/signalscan/signalscan.js mobile/www/signalscan.js
      - name: Add Android platform
        working-directory: mobile
        run: npx cap add android
      - name: Sync Android
        working-directory: mobile
        run: npx cap sync android
      - name: Set Android version
        working-directory: mobile
        shell: bash
        run: |
          set -euo pipefail
          VERSION_NAME="$(jq -r '.version' factory/runtime-product.json)"
          VERSION_CODE="$(node -e 'const v=process.argv[1].split(".").map(Number); console.log(v[0]*10000+v[1]*100+v[2])' "$VERSION_NAME")"
          export VERSION_NAME VERSION_CODE
          python3 - <<'PY'
          from pathlib import Path
          import os,re
          p=Path("android/app/build.gradle")
          s=p.read_text()
          if len(re.findall(r'\bversionCode\s+\d+',s)) != 1: raise SystemExit("versionCode count mismatch")
          if len(re.findall(r'\bversionName\s+"[^"]+"',s)) != 1: raise SystemExit("versionName count mismatch")
          s=re.sub(r'\bversionCode\s+\d+',f'versionCode {os.environ["VERSION_CODE"]}',s,count=1)
          s=re.sub(r'\bversionName\s+"[^"]+"',f'versionName "{os.environ["VERSION_NAME"]}"',s,count=1)
          p.write_text(s)
          PY
      - name: Factory X preflight
        run: node mobile/factory/x/preflight.mjs
      - name: Source certification gate
        run: node mobile/factory/certification-gate.mjs signalscan-ai
      - name: Factory quality gate
        run: node mobile/factory/quality-gate.mjs signalscan-ai
      - name: Product contract smoke
        run: node mobile/factory/product-smoke/signalscan-ai.mjs
      - name: JavaScript syntax audit
        run: node --check mobile/web/signalscan/signalscan.js
      - name: Build release APK
        working-directory: mobile/android
        run: ./gradlew assembleRelease --no-daemon --stacktrace
      - name: Sign and certify APK artifact
        shell: bash
        env:
          ANDROID_KEYSTORE_B64: \${{ secrets.MIDAD_ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: \${{ secrets.MIDAD_ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: \${{ secrets.MIDAD_ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: \${{ secrets.MIDAD_ANDROID_KEY_PASSWORD }}
          CUSTOMER_DELIVERY: \${{ inputs.customer_delivery || false }}
        run: |
          set -euo pipefail
          APK_SRC="mobile/android/app/build/outputs/apk/release/app-release-unsigned.apk"
          test -f "$APK_SRC"
          mkdir -p dist signing
          CHANNEL="$(jq -r '.release_channel' mobile/factory/runtime-product.json)"
          if [ "$CHANNEL" = "production" ]; then
            test -n "\${ANDROID_KEYSTORE_B64:-}" || { echo "BLOCKED: production keystore secret missing"; exit 1; }
            test -n "\${ANDROID_KEYSTORE_PASSWORD:-}" || { echo "BLOCKED: production keystore password missing"; exit 1; }
            test -n "\${ANDROID_KEY_ALIAS:-}" || { echo "BLOCKED: production key alias missing"; exit 1; }
            test -n "\${ANDROID_KEY_PASSWORD:-}" || { echo "BLOCKED: production key password missing"; exit 1; }
            printf '%s' "$ANDROID_KEYSTORE_B64" | base64 --decode > signing/release.jks
            KS_PATH="signing/release.jks"
            KS_PASS="$ANDROID_KEYSTORE_PASSWORD"
            KEY_ALIAS="$ANDROID_KEY_ALIAS"
            KEY_PASS="$ANDROID_KEY_PASSWORD"
            PROD_SIGNING=true
          else
            TMP_PASS="$(openssl rand -hex 32)"
            keytool -genkeypair -v -keystore signing/temporary.jks -storepass "$TMP_PASS" -keypass "$TMP_PASS" -alias signalscan -keyalg RSA -keysize 2048 -validity 3650 -dname "CN=SignalScan AI Temporary, OU=MIDAD, O=MIDAD, C=XX"
            KS_PATH="signing/temporary.jks"
            KS_PASS="$TMP_PASS"
            KEY_ALIAS="signalscan"
            KEY_PASS="$TMP_PASS"
            PROD_SIGNING=false
          fi
          APKSIGNER="$(find "\${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          AAPT="$(find "\${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          test -x "$APKSIGNER"
          test -x "$AAPT"
          OUT="dist/SignalScan-AI-v$(jq -r '.version' mobile/factory/runtime-product.json)-release.apk"
          "$APKSIGNER" sign --ks "$KS_PATH" --ks-pass "pass:$KS_PASS" --key-pass "pass:$KEY_PASS" --ks-key-alias "$KEY_ALIAS" --out "$OUT" "$APK_SRC"
          "$APKSIGNER" verify --verbose "$OUT"
          sha256sum "$OUT" | tee "$OUT.sha256"
          cp mobile/factory/runtime-product.json dist/product-manifest.json
          cp mobile/factory/runtime-factory.json dist/factory-runtime.json
          APKSIGNER="$APKSIGNER" AAPT="$AAPT" PRODUCTION_SIGNING="$PROD_SIGNING" CUSTOMER_DELIVERY="$CUSTOMER_DELIVERY" node mobile/factory/artifact-certification.mjs signalscan-ai "$OUT"
          jq -e '.status=="CERTIFIED_ARTIFACT"' mobile/factory/reports/signalscan-ai-artifact-certification.json >/dev/null
          jq -e '.checks.apksigner=="VERIFIED"' mobile/factory/reports/signalscan-ai-artifact-certification.json >/dev/null
          jq -e '.product_key=="signalscan-ai"' mobile/factory/reports/signalscan-ai-artifact-certification.json >/dev/null
          printf '{"product_key":"signalscan-ai","build_status":"PASSED","factory_quality_gate":"PASSED","source_certification":"PASSED","artifact_certification":"PASSED"}\n' > dist/build-report.json
          cp mobile/factory/reports/signalscan-ai-artifact-certification.json dist/artifact-certification.json
          rm -rf signing
      - name: Upload SignalScan artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SignalScan-AI-v${{ fromJSON('{"version":"0.3.1"}').version }}-release
          path: |
            dist/*.apk
            dist/*.sha256
            dist/product-manifest.json
            dist/factory-runtime.json
            dist/build-report.json
            dist/test-report.json
            dist/learning-report.json
