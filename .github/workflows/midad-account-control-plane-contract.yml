name: MIDAD Account Control Plane Contract
on:
  push:
    branches: [main, "feat/midad-account-control-plane-source-parity-*"]
    paths:
      - "supabase/functions/midad_account_factory/index.ts"
      - "supabase/functions/midad_human_bridge/index.ts"
      - "tools/midad-browser-runtime/test_account_factory_contract.py"
      - "tools/midad-browser-runtime/test_human_bridge_contract.py"
      - ".github/workflows/midad-account-control-plane-contract.yml"
  pull_request:
    paths:
      - "supabase/functions/midad_account_factory/index.ts"
      - "supabase/functions/midad_human_bridge/index.ts"
      - "tools/midad-browser-runtime/test_account_factory_contract.py"
      - "tools/midad-browser-runtime/test_human_bridge_contract.py"
      - ".github/workflows/midad-account-control-plane-contract.yml"
permissions:
  contents: read
jobs:
  contract-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify Account Factory contract
        run: python tools/midad-browser-runtime/test_account_factory_contract.py -v
      - name: Verify Human Bridge contract
        run: python tools/midad-browser-runtime/test_human_bridge_contract.py -v
