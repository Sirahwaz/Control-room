name: MIDAD Gemini Model Preflight Contract

on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/midad_ai_router/**"
      - ".github/workflows/midad-gemini-model-preflight.yml"
  pull_request:
    paths:
      - "supabase/functions/midad_ai_router/**"
      - ".github/workflows/midad-gemini-model-preflight.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Gemini catalog parser contract tests
        run: node --test supabase/functions/midad_ai_router/gemini-catalog.test.mjs
      - name: AI router type-check
        run: deno check supabase/functions/midad_ai_router/index.ts
