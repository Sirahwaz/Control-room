name: MIDAD Session Core

on:
  pull_request:
    paths:
      - 'tools/midad-session-core/**'
      - 'tools/midad-browser-runtime/**'
      - '.github/workflows/midad-session-core.yml'
  push:
    branches:
      - main
    paths:
      - 'tools/midad-session-core/**'
      - 'tools/midad-browser-runtime/**'
      - '.github/workflows/midad-session-core.yml'

permissions:
  contents: read

jobs:
  session-core-contract:
    name: Session Core security contracts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install session core dependency
        run: python -m pip install --disable-pip-version-check -r tools/midad-session-core/requirements.txt
      - name: Run session core contract tests
        working-directory: tools/midad-session-core
        run: python -m unittest -v

  existing-browser-worker-contract:
    name: Existing Browser Mesh worker regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run existing browser worker tests
        working-directory: tools/midad-browser-runtime
        run: python -m unittest -v
