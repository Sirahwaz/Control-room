name: MIDAD Native Browser Android APK

on:
  pull_request:
    branches: ["main"]
    paths:
      - "mobile/factory/products/midad-browser.json"
      - "mobile/factory/product.schema.json"
      - "mobile/factory/native/midad-browser/**"
      - "tests/midad-browser-offline-home-contract.test.mjs"
      - "mobile/web/midad-browser-mesh.html"
      - "mobile/web/midad-browser-mesh.css"
      - "mobile/web/midad-browser-mesh.js"
      - "tests/midad-browser-mesh-ui-contract.test.mjs"
      - "mobile/factory/quality-gate.mjs"
      - "mobile/package.json"
      - "midad-browser.html"
      - "midad-browser.css"
      - "midad-browser.js"
      - ".github/workflows/midad-browser-android.yml"
  push:
    branches: ["main"]
    paths:
      - "mobile/factory/products/midad-browser.json"
      - "mobile/factory/product.schema.json"
      - "mobile/factory/native/midad-browser/**"
      - "tests/midad-browser-offline-home-contract.test.mjs"
      - "mobile/web/midad-browser-mesh.html"
      - "mobile/web/midad-browser-mesh.css"
      - "mobile/web/midad-browser-mesh.js"
      - "tests/midad-browser-mesh-ui-contract.test.mjs"
      - "midad-browser.html"
      - "midad-browser.css"
      - "midad-browser.js"
      - ".github/workflows/midad-browser-android.yml"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  agentation-ui-feedback:
    uses: ./.github/workflows/agentation-e2e.yml
    with:
      product_key: midad-browser

  build-browser-apk:
    needs: agentation-ui-feedback
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout MIDAD
        uses: actions/checkout@v4

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Browser Mesh and offline-home contract tests
        run: node --test tests/midad-browser-offline-home-contract.test.mjs tests/midad-browser-mesh-ui-contract.test.mjs

      - name: Resolve Browser product
        id: product
        shell: bash
        run: |
          set -euo pipefail
          node mobile/factory/render.mjs midad-browser
          jq -e '.product_key=="midad-browser"' mobile/factory/runtime-product.json >/dev/null
          jq -e '.features.server_side_secrets_only==true' mobile/factory/runtime-product.json >/dev/null
          jq -e '.features.default_browser_role==true' mobile/factory/runtime-product.json >/dev/null
          jq -e '.features.safe_browsing==true' mobile/factory/runtime-product.json >/dev/null
          echo "version=$(jq -r '.version' mobile/factory/runtime-product.json)" >> "$GITHUB_OUTPUT"
          echo "artifact_name=$(jq -r '.artifact_name' mobile/factory/runtime-product.json)" >> "$GITHUB_OUTPUT"
          echo "app_id=$(jq -r '.app_id' mobile/factory/runtime-product.json)" >> "$GITHUB_OUTPUT"

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Prepare Android SDK
        shell: bash
        run: |
          set -euo pipefail
          ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

      - name: Install Capacitor dependencies
        working-directory: mobile
        run: npm install --no-fund --no-audit

      - name: Prepare manifest-selected MIDAD Browser Mesh surface
        shell: bash
        run: |
          set -euo pipefail
          WEB_ENTRY="$(jq -r '.web_entry' mobile/factory/runtime-product.json)"
          test -f "$WEB_ENTRY"
          rm -rf mobile/www
          mkdir -p mobile/www
          cp "$WEB_ENTRY" mobile/www/index.html
          jq -e '.web_assets | length >= 2' mobile/factory/runtime-product.json >/dev/null
          while IFS= read -r asset; do
            [ -z "$asset" ] && continue
            test -f "$asset"
            cp "$asset" mobile/www/
          done < <(jq -r '.web_assets[]' mobile/factory/runtime-product.json)
          test -f mobile/www/midad-browser-mesh.css
          test -f mobile/www/midad-browser-mesh.js

      - name: Add Android platform
        working-directory: mobile
        run: npx cap add android

      - name: Sync Android
        working-directory: mobile
        run: npx cap sync android

      - name: Install native browser activity and Android browser intents
        run: python3 mobile/factory/native/midad-browser/prepare_android.py

      - name: Set Android version
        working-directory: mobile
        shell: bash
        run: |
          set -euo pipefail
          VERSION_NAME="$(jq -r '.version' factory/runtime-product.json)"
          VERSION_CODE="$(node -e 'const v=process.argv[1].split(".").map(Number); console.log(v[0]*10000+v[1]*100+v[2])' "$VERSION_NAME")"
          export VERSION_NAME VERSION_CODE
          python3 - <<'PY'
          from pathlib import Path
          import os, re
          p=Path("android/app/build.gradle")
          s=p.read_text()
          if len(re.findall(r'\bversionCode\s+\d+',s)) != 1: raise SystemExit("Expected one versionCode")
          if len(re.findall(r'\bversionName\s+"[^"]+"',s)) != 1: raise SystemExit("Expected one versionName")
          s=re.sub(r'\bversionCode\s+\d+',f'versionCode {os.environ["VERSION_CODE"]}',s,count=1)
          s=re.sub(r'\bversionName\s+"[^"]+"',f'versionName "{os.environ["VERSION_NAME"]}"',s,count=1)
          p.write_text(s)
          PY

      - name: Factory quality gate
        run: node mobile/factory/quality-gate.mjs midad-browser

      - name: JavaScript syntax audit
        run: node --check mobile/web/midad-browser-mesh.js

      - name: Native browser source audit
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'ROLE_BROWSER' mobile/factory/native/midad-browser/BrowserActivity.java
          grep -q 'handler.cancel()' mobile/factory/native/midad-browser/BrowserActivity.java
          grep -q 'MIXED_CONTENT_NEVER_ALLOW' mobile/factory/native/midad-browser/BrowserActivity.java
          grep -q 'android.intent.action.VIEW' mobile/android/app/src/main/AndroidManifest.xml
          grep -q 'android.intent.category.BROWSABLE' mobile/android/app/src/main/AndroidManifest.xml

      - name: Build release APK
        working-directory: mobile/android
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Sign APK for installation
        shell: bash
        run: |
          set -euo pipefail
          APK_SRC="mobile/android/app/build/outputs/apk/release/app-release-unsigned.apk"
          test -f "$APK_SRC"
          mkdir -p dist signing
          EPHEMERAL_KEYSTORE_PASS="$(openssl rand -hex 32)"
          echo "::add-mask::$EPHEMERAL_KEYSTORE_PASS"
          keytool -genkeypair -v -keystore signing/midad-browser-temp.jks -storepass "$EPHEMERAL_KEYSTORE_PASS" -keypass "$EPHEMERAL_KEYSTORE_PASS" -alias midad -keyalg RSA -keysize 2048 -validity 3650 -dname "CN=MIDAD Browser, OU=MIDAD, O=MIDAD, L=Global, ST=Global, C=XX"
          APKSIGNER="$(find "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          "$APKSIGNER" sign --ks signing/midad-browser-temp.jks --ks-pass "pass:$EPHEMERAL_KEYSTORE_PASS" --key-pass "pass:$EPHEMERAL_KEYSTORE_PASS" --ks-key-alias midad --out "dist/${{ steps.product.outputs.artifact_name }}-release.apk" "$APK_SRC"
          "$APKSIGNER" verify --verbose "dist/${{ steps.product.outputs.artifact_name }}-release.apk"
          sha256sum "dist/${{ steps.product.outputs.artifact_name }}-release.apk" | tee "dist/${{ steps.product.outputs.artifact_name }}-release.apk.sha256"
          cp mobile/factory/runtime-product.json dist/product-manifest.json
          rm -rf signing

      - name: Enable KVM for Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node/kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install and verify Browser APK on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          disable-animations: true
          script: bash mobile/factory/native/midad-browser/runtime-smoke.sh "${{ steps.product.outputs.app_id }}" "dist/${{ steps.product.outputs.artifact_name }}-release.apk"

      - name: Upload Browser APK and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.product.outputs.artifact_name }}-release
          if-no-files-found: ignore
          path: |
            dist/${{ steps.product.outputs.artifact_name }}-release.apk
            dist/${{ steps.product.outputs.artifact_name }}-release.apk.sha256
            dist/product-manifest.json
# Trigger note: run the existing MIDAD Browser release + emulator acceptance lane.
