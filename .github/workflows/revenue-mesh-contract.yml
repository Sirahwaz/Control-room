name: MIDAD Revenue Mesh Contract

on:
  push:
    branches:
      - main
      - feat/revenue-mesh-bounded-parallel-20261025
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  revenue-mesh-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Whitespace and patch hygiene
        run: git diff --check
      - name: Type-check the Edge Function source
        run: deno check supabase/functions/midad_revenue_intel_work_queue_worker/index.ts
      - name: Test extensible provider registry contract
        run: deno test supabase/functions/midad_revenue_intelligence_mesh/provider_registry_test.ts
      - name: Revenue mesh unit and integration contract tests
        run: node --test supabase/functions/midad_revenue_intel_work_queue_worker/*.test.mjs
