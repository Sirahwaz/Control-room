name: MIDAD Isolated Playwright Runtime Tests
on:
  push:
    branches: [main]
    paths:
      - "tools/midad-browser-runtime/**"
      - ".github/workflows/midad-browser-runtime-tests.yml"
  pull_request:
    paths:
      - "tools/midad-browser-runtime/**"
      - ".github/workflows/midad-browser-runtime-tests.yml"
permissions:
  contents: read
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned runtime dependencies
        working-directory: tools/midad-browser-runtime
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Run encrypted session store tests first
        working-directory: tools/midad-browser-runtime
        run: python -m unittest -v test_encrypted_session_store
      - name: Run isolated policy and lifecycle tests (no network or browser)
        working-directory: tools/midad-browser-runtime
        run: python -m unittest -v
      - name: Run deterministic offline Revenue Radar evaluation
        working-directory: tools/midad-browser-runtime
        run: python revenue_radar_eval.py --fail-on-review --output "$RUNNER_TEMP/midad-revenue-radar-evaluation.json"
      - name: Upload Revenue Radar evaluation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: midad-revenue-radar-evaluation-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/midad-revenue-radar-evaluation.json
          if-no-files-found: warn
          retention-days: 14
