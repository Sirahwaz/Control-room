name: MIDAD Isolated Playwright Runtime Tests
on:
  push:
    branches: [main]
    paths:
      - "tools/midad-browser-runtime/**"
      - ".github/workflows/midad-browser-runtime-tests.yml"
  pull_request:
    paths:
      - "tools/midad-browser-runtime/**"
      - ".github/workflows/midad-browser-runtime-tests.yml"
permissions:
  contents: read
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run focused Proxy and Vault policy tests
        working-directory: tools/midad-browser-runtime
        run: python -m unittest -v test_proxy_policy
      - name: Run complete isolated policy and lifecycle suite
        working-directory: tools/midad-browser-runtime
        run: python -m unittest -v
