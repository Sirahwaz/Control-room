name: MIDAD Browser Gateway — Contract Suite
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "supabase/functions/midad_browser_agent_gateway/**"
      - "supabase/functions/midad_browser_github_worker/**"
      - ".github/workflows/midad-browser-ephemeral-worker.yml"
      - "tests/browser-gateway-oidc-readonly-contract.test.mjs"
      - "ai-room.html"
      - "tests/browser-gateway-source-parity.test.mjs"
      - "tests/browser-gateway-auth.test.mjs"
      - "supabase/migrations/20261119205535_midad_browser_worker_leases_v1.sql"
      - "supabase/migrations/20261119210004_midad_browser_readonly_claims_v1.sql"
      - "supabase/migrations/20261119214000_midad_browser_readonly_claim_hardening_v1.sql"
      - "supabase/migrations/20261119213000_midad_browser_public_evidence_excerpt_v1.sql"
      - "supabase/tests/midad_browser_readonly_claims_v1.sql"
      - "supabase/tests/midad_browser_worker_leases_v1.sql"
      - "supabase/tests/midad_browser_evidence_ledger_v1.sql"
      - "tests/browser-gateway-lease-contract.test.mjs"
      - "supabase/migrations/20261117110000_midad_control_room_owner_bound_sessions.sql"
      - "supabase/tests/fixtures/midad_browser_gateway_base_schema.sql"
      - ".github/workflows/midad-browser-gateway-contract.yml"
  push:
    branches: [main]
    paths:
      - "supabase/functions/midad_browser_agent_gateway/**"
      - "supabase/functions/midad_browser_github_worker/**"
      - ".github/workflows/midad-browser-ephemeral-worker.yml"
      - "tests/browser-gateway-oidc-readonly-contract.test.mjs"
      - "ai-room.html"
      - "supabase/migrations/20261119210004_midad_browser_readonly_claims_v1.sql"
      - "supabase/migrations/20261119213000_midad_browser_public_evidence_excerpt_v1.sql"
      - "supabase/tests/midad_browser_readonly_claims_v1.sql"
      - "tests/browser-gateway-source-parity.test.mjs"
      - "supabase/migrations/20261022080000_midad_browser_evidence_ledger_v1.sql"
      - "supabase/migrations/20261022100000_midad_browser_smoke_auth_v1.sql"
      - "supabase/migrations/20261119205535_midad_browser_worker_leases_v1.sql"
      - "supabase/tests/midad_browser_worker_leases_v1.sql"
      - "tests/browser-gateway-lease-contract.test.mjs"
      - "supabase/tests/midad_browser_evidence_ledger_v1.sql"
      - "supabase/tests/fixtures/**"
      - ".github/workflows/midad-browser-gateway-contract.yml"
permissions:
  contents: read
jobs:
  gateway-ledger-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: midad_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d midad_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      MIDAD_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/midad_test
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check mirrored gateway source
        run: deno check supabase/functions/midad_browser_agent_gateway/index.ts
      - name: Run offline ledger helper tests
        run: deno test supabase/functions/midad_browser_agent_gateway/ledger.test.ts
      - name: Run offline worker lease helper tests
        run: deno test supabase/functions/midad_browser_agent_gateway/lease.test.ts
      - name: Run GitHub Actions OIDC verifier tests
        run: deno test supabase/functions/midad_browser_github_worker/oidc.test.ts
      - name: Type-check GitHub OIDC worker proxy
        run: deno check supabase/functions/midad_browser_github_worker/index.ts
      - name: Run gateway atomic lease source contract
        run: node --test tests/browser-gateway-lease-contract.test.mjs
      - name: Run OIDC read-only worker source contract
        run: node --test tests/browser-gateway-oidc-readonly-contract.test.mjs
      - name: Run gateway source parity snapshot contract
        run: node --test tests/browser-gateway-source-parity.test.mjs
      - name: Run gateway authorization parsing regression tests
        run: node --test tests/browser-gateway-auth.test.mjs
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
      - name: Initialize disposable Supabase-compatible PostgreSQL fixture
        run: psql "$MIDAD_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/tests/fixtures/midad_browser_gateway_base_schema.sql
      - name: Apply browser evidence ledger migrations to disposable database
        run: |
          psql "$MIDAD_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/20261022080000_midad_browser_evidence_ledger_v1.sql
          psql "$MIDAD_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/20261022100000_midad_browser_smoke_auth_v1.sql
          psql "$MIDAD_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/20261117110000_midad_control_room_owner_bound_sessions.sql
          psql "$MIDAD_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/20261119205535_midad_browser_worker_leases_v1.sql
          psql "$MIDAD_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/20261119210004_midad_browser_readonly_claims_v1.sql
          psql "$MIDAD_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/20261119214000_midad_browser_readonly_claim_hardening_v1.sql
          psql "$MIDAD_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/20261119213000_midad_browser_public_evidence_excerpt_v1.sql
      - name: Verify owner-bound session migration and preserve legacy sessions
        run: |
          psql "$MIDAD_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          DO $check$
          BEGIN
            IF NOT EXISTS (
              SELECT 1 FROM information_schema.columns
              WHERE table_schema='public' AND table_name='control_room_sessions'
                AND column_name='owner_user_id' AND data_type='uuid'
            ) THEN
              RAISE EXCEPTION 'owner_user_id_column_missing';
            END IF;
            IF NOT EXISTS (
              SELECT 1 FROM pg_indexes
              WHERE schemaname='public' AND tablename='control_room_sessions'
                AND indexname='control_room_sessions_owner_active_idx'
            ) THEN
              RAISE EXCEPTION 'owner_session_index_missing';
            END IF;
            IF NOT EXISTS (
              SELECT 1 FROM public.control_room_sessions
              WHERE telegram_user_id='telegram-fixture-legacy' AND owner_user_id IS NULL AND active=true
            ) THEN
              RAISE EXCEPTION 'legacy_session_must_remain_unbound_and_unmodified';
            END IF;
          END;
          $check$;
          SQL
      - name: Run SQL atomic worker lease lifecycle and privilege tests
        run: psql "$MIDAD_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/tests/midad_browser_worker_leases_v1.sql
      - name: Run SQL read-only browser claim isolation and lease recovery tests
        run: psql "$MIDAD_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/tests/midad_browser_readonly_claims_v1.sql
      - name: Run SQL ledger, idempotency, PAID-guard and cleanup contract tests
        run: psql "$MIDAD_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/tests/midad_browser_evidence_ledger_v1.sql
      - name: Verify disposable database returned to baseline
        run: |
          psql "$MIDAD_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          DO $check$
          BEGIN
            IF EXISTS (SELECT 1 FROM public.midad_browser_jobs) THEN
              RAISE EXCEPTION 'browser_jobs_remain_after_contract_test';
            END IF;
            IF EXISTS (SELECT 1 FROM public.midad_browser_evidence_ledger) THEN
              RAISE EXCEPTION 'evidence_rows_remain_after_contract_test';
            END IF;
            IF EXISTS (SELECT 1 FROM public.midad_agent_events) THEN
              RAISE EXCEPTION 'agent_events_remain_after_contract_test';
            END IF;
            IF EXISTS (SELECT 1 FROM public.midad_browser_smoke_tokens) THEN
              RAISE EXCEPTION 'smoke_tokens_remain_after_contract_test';
            END IF;
            IF (SELECT count(*) FROM auth.users) <> 1 THEN
              RAISE EXCEPTION 'unexpected_auth_users_after_contract_test';
            END IF;
          END;
          $check$;
          SQL
      - name: Verify live gateway rejects unauthenticated request
        env:
          MIDAD_GATEWAY_URL: https://froegigfmpmvtecztfbf.supabase.co/functions/v1/midad_browser_agent_gateway
        run: |
          set -euo pipefail
          response_file="$(mktemp)"
          status="$(curl --silent --show-error --max-time 10 -o "$response_file" -w "%{http_code}" \
            -X POST "$MIDAD_GATEWAY_URL" \
            -H "content-type: application/json" \
            --data '{"action":"capabilities"}')"
          if [ "$status" != "401" ]; then
            echo "Expected an unauthenticated 401; received HTTP $status."
            exit 1
          fi
          python3 - "$response_file" <<'PY'
          import json, sys
          with open(sys.argv[1], encoding="utf-8") as stream:
              body = json.load(stream)
          if body.get("ok") is not False or body.get("error") != "unauthorized":
              raise SystemExit("Gateway did not return the expected unauthorized contract")
          print("Live gateway correctly rejected the unauthenticated request with HTTP 401.")
          PY
          rm -f "$response_file"
