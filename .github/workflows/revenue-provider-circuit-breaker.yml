name: Revenue Provider Circuit Breaker
on:
  pull_request:
    paths:
      - 'supabase/functions/midad_revenue_intel_work_queue_worker/**'
      - '.github/workflows/revenue-provider-circuit-breaker.yml'
  push:
    paths:
      - 'supabase/functions/midad_revenue_intel_work_queue_worker/**'
      - '.github/workflows/revenue-provider-circuit-breaker.yml'
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test supabase/functions/midad_revenue_intel_work_queue_worker/provider_circuit_breaker.test.mjs
