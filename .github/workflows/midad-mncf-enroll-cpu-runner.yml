name: MIDAD MNCF — Enroll CPU Runner and Execute Smoke Task

on:
  push:
    branches: [main]
    paths:
      - ".github/mncf/cpu-runner-enrollment-request.json"
  workflow_dispatch:
    inputs:
      owner_id:
        description: Exact MIDAD owner_id that will own the CPU node and smoke task
        required: true
        type: string
      consent:
        description: Type I_APPROVE_CPU_NODE_ENROLLMENT to confirm this owner-scoped enrollment
        required: true
        type: string

permissions:
  contents: read
  actions: write

concurrency:
  group: midad-mncf-cpu-runner-enrollment
  cancel-in-progress: false

jobs:
  enroll-and-smoke:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: cloudflare-production
    timeout-minutes: 10
    steps:
      - name: Checkout trusted main code
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Wait for the OIDC-enabled Continuity Worker, enroll CPU node and dispatch zero-cost smoke task
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          MIDAD_LEDGER_ADMIN_KEY: ${{ secrets.MIDAD_LEDGER_ADMIN_KEY }}
          MIDAD_OWNER_ID_INPUT: ${{ inputs.owner_id }}
          MIDAD_OWNER_CONSENT: ${{ inputs.consent }}
          MIDAD_RUN_ID: ${{ github.run_id }}
          MIDAD_EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          import { setTimeout as delay } from 'node:timers/promises';

          const bootstrapPush = process.env.MIDAD_EVENT_NAME === 'push';
          const requestPath = `${process.env.GITHUB_WORKSPACE}/.github/mncf/cpu-runner-enrollment-request.json`;
          const request = bootstrapPush ? JSON.parse(readFileSync(requestPath, 'utf8')) : null;
          if (bootstrapPush && (
            request?.request_id !== 'MNCF-CPU-BOOTSTRAP-20261112-002' ||
            request?.owner_id !== 'github:116122510' ||
            request?.consent !== 'I_APPROVE_CPU_NODE_ENROLLMENT' ||
            request?.requested_capability !== 'cpu-batch' ||
            request?.task !== 'RUNNER_SMOKE' ||
            request?.max_cost_usd !== 0 ||
            request?.authorization_source !== 'explicit_user_confirmation' ||
            request?.trigger_attempt !== 4 ||
            request?.retry_of_run_id !== '43299128578' ||
            request?.retry_reason !== 'github_oidc_replaces_github_secrets_api'
          )) throw new Error('BOOTSTRAP_REQUEST_NOT_AUTHORIZED');

          const ownerId = request?.owner_id || process.env.MIDAD_OWNER_ID_INPUT || '';
          const consent = request?.consent || process.env.MIDAD_OWNER_CONSENT || '';
          const adminKey = process.env.MIDAD_LEDGER_ADMIN_KEY || '';
          const ghToken = process.env.GH_TOKEN || '';
          const runId = process.env.MIDAD_RUN_ID || '';
          const origin = 'https://midad-continuity-ledger.midadbot.workers.dev';
          const repo = 'Sirahwaz/Control-room';
          const nodeId = 'github-actions-cpu-batch';
          const validId = value => typeof value === 'string' && /^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$/.test(value);

          if (!validId(ownerId) || ownerId !== 'github:116122510') throw new Error('OWNER_ID_NOT_APPROVED');
          if (consent !== 'I_APPROVE_CPU_NODE_ENROLLMENT') throw new Error('OWNER_CONSENT_REQUIRED');
          if (adminKey.length < 32) throw new Error('LEDGER_ADMIN_KEY_MISSING');
          if (!/^\\d+$/.test(runId)) throw new Error('GITHUB_RUN_ID_INVALID');
          if (!ghToken) throw new Error('GITHUB_TOKEN_MISSING');

          // Do not enroll against the old Worker version. The deployment workflow runs in parallel on this merge.
          let oidcWorkerReady = false;
          for (let attempt = 1; attempt <= 36; attempt += 1) {
            try {
              const healthResponse = await fetch(origin + '/health', {
                redirect: 'error',
                signal: AbortSignal.timeout(8000),
                headers: { accept: 'application/json' },
              });
              if (healthResponse.ok) {
                const health = await healthResponse.json();
                if (health?.ok === true &&
                    health?.service === 'midad-continuity-ledger' &&
                    health?.node_auth === 'github-actions-oidc-v1') {
                  oidcWorkerReady = true;
                  break;
                }
              }
            } catch {}
            await delay(5000);
          }
          if (!oidcWorkerReady) throw new Error('LEDGER_OIDC_DEPLOYMENT_NOT_READY');

          const github = async (method, apiPath, body) => {
            const response = await fetch('https://api.github.com' + apiPath, {
              method,
              redirect: 'error',
              signal: AbortSignal.timeout(15000),
              headers: {
                authorization: 'Bearer ' + ghToken,
                accept: 'application/vnd.github+json',
                'x-github-api-version': '2022-11-28',
                ...(body ? { 'content-type': 'application/json' } : {}),
              },
              ...(body ? { body: JSON.stringify(body) } : {}),
            });
            const raw = await response.text();
            if (!response.ok) throw new Error('GITHUB_API_' + method + '_' + response.status);
            return raw ? JSON.parse(raw) : null;
          };

          const ledgerPost = async (path, body) => {
            const response = await fetch(origin + path, {
              method: 'POST',
              redirect: 'error',
              signal: AbortSignal.timeout(15000),
              headers: {
                authorization: 'Bearer ' + adminKey,
                'content-type': 'application/json',
                accept: 'application/json',
              },
              body: JSON.stringify(body),
            });
            let data;
            try { data = await response.json(); } catch { throw new Error('LEDGER_RESPONSE_INVALID'); }
            if (!response.ok || data?.ok !== true) {
              throw new Error('LEDGER_API_' + response.status + '_' + String(data?.error || 'FAILED'));
            }
            return data;
          };

          const enrolled = await ledgerPost('/v1/nodes/enroll', {
            node_id: nodeId,
            owner_id: ownerId,
            consent_confirmed: true,
            capabilities: ['cpu-batch'],
            auth_mode: 'github-actions-oidc',
          });
          if (enrolled.node_id !== nodeId ||
              enrolled.authentication !== 'github-actions-oidc' ||
              enrolled.token_delivery !== 'none' ||
              Object.hasOwn(enrolled, 'enrollment_token')) {
            throw new Error('OIDC_NODE_ENROLLMENT_NOT_CONFIRMED');
          }

          const taskId = 'mncf-cpu-smoke-' + runId;
          const eventId = 'mncf-cpu-event-' + runId;
          const task = await ledgerPost('/v1/tasks/enqueue', {
            task_id: taskId,
            owner_id: ownerId,
            idempotency_key: 'mncf-cpu-smoke:' + runId,
            payload: { operation: 'RUNNER_SMOKE', input: {} },
            workload: 'CPU_BATCH',
            required_capabilities: [],
            min_cpu_cores: 1,
            min_memory_mb: 512,
            units: 1,
            estimated_seconds_per_unit: 2,
            max_cost_usd: 0,
            retry_mode: 'AT_LEAST_ONCE_IDEMPOTENT',
            max_attempts: 1,
          });
          if (task.task_id !== taskId || !['QUEUED', 'COMPLETED'].includes(task.state)) {
            throw new Error('SMOKE_TASK_ENQUEUE_NOT_CONFIRMED');
          }

          await github('POST', '/repos/' + repo + '/actions/workflows/midad-mncf-ephemeral-runner.yml/dispatches', {
            ref: 'main',
            inputs: { owner_id: ownerId, task_id: taskId, event_id: eventId },
          });

          process.stdout.write(JSON.stringify({
            status: 'OIDC_NODE_ENROLLED_AND_DISPATCHED',
            node_id: nodeId,
            owner_id: ownerId,
            capability: 'cpu-batch',
            task_id: taskId,
            task_state: task.state,
            runner_workflow: 'midad-mncf-ephemeral-runner.yml',
            authentication: 'github-actions-oidc',
            persistent_runner_secret_created: false,
            max_cost_usd: 0,
          }) + '\\n');
          NODE
