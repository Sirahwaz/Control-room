name: MIDAD MNCF — Enroll CPU Runner and Execute Smoke Task

on:
  workflow_dispatch:
    inputs:
      owner_id:
        description: Exact MIDAD owner_id that will own the CPU node and smoke task
        required: true
        type: string
      consent:
        description: Type I_APPROVE_CPU_NODE_ENROLLMENT to confirm this owner-scoped enrollment
        required: true
        type: string

permissions:
  contents: read
  actions: write

concurrency:
  group: midad-mncf-cpu-runner-enrollment
  cancel-in-progress: false

jobs:
  enroll-and-smoke:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: cloudflare-production
    timeout-minutes: 10
    steps:
      - name: Checkout trusted main code
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install pinned GitHub secret encryption dependency
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/midad-cpu-enrollment"
          cd "$RUNNER_TEMP/midad-cpu-enrollment"
          npm init -y >/dev/null
          npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund libsodium-wrappers@0.8.4

      - name: Enroll owner-approved CPU node, store token securely, enqueue and dispatch smoke task
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          MIDAD_LEDGER_ADMIN_KEY: ${{ secrets.MIDAD_LEDGER_ADMIN_KEY }}
          MIDAD_OWNER_ID_INPUT: ${{ inputs.owner_id }}
          MIDAD_OWNER_CONSENT: ${{ inputs.consent }}
          MIDAD_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/midad-cpu-enrollment"
          node --input-type=module <<'NODE'
          import sodium from 'libsodium-wrappers';
          await sodium.ready;

          const ownerId = process.env.MIDAD_OWNER_ID_INPUT || '';
          const consent = process.env.MIDAD_OWNER_CONSENT || '';
          const adminKey = process.env.MIDAD_LEDGER_ADMIN_KEY || '';
          const ghToken = process.env.GH_TOKEN || '';
          const runId = process.env.MIDAD_RUN_ID || '';
          const origin = 'https://midad-continuity-ledger.midadbot.workers.dev';
          const repo = 'Sirahwaz/Control-room';
          const nodeId = 'github-actions-cpu-batch';
          const secretName = 'MIDAD_CONTINUITY_RUNNER_NODE_TOKEN';
          const validId = value => typeof value === 'string' && /^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$/.test(value);

          if (!validId(ownerId)) throw new Error('OWNER_ID_INVALID');
          if (consent !== 'I_APPROVE_CPU_NODE_ENROLLMENT') throw new Error('OWNER_CONSENT_REQUIRED');
          if (adminKey.length < 32) throw new Error('LEDGER_ADMIN_KEY_MISSING');
          if (!/^\d+$/.test(runId)) throw new Error('GITHUB_RUN_ID_INVALID');
          if (!ghToken) throw new Error('GITHUB_TOKEN_MISSING');

          const github = async (method, apiPath, body) => {
            const response = await fetch('https://api.github.com' + apiPath, {
              method,
              redirect: 'error',
              signal: AbortSignal.timeout(15000),
              headers: {
                authorization: 'Bearer ' + ghToken,
                accept: 'application/vnd.github+json',
                'x-github-api-version': '2022-11-28',
                ...(body ? { 'content-type': 'application/json' } : {}),
              },
              ...(body ? { body: JSON.stringify(body) } : {}),
            });
            const raw = await response.text();
            if (!response.ok) throw new Error('GITHUB_API_' + method + '_' + response.status);
            return raw ? JSON.parse(raw) : null;
          };

          const existingSecret = await fetch(
            'https://api.github.com/repos/' + repo + '/actions/secrets/' + secretName,
            { headers: { authorization: 'Bearer ' + ghToken, accept: 'application/vnd.github+json', 'x-github-api-version': '2022-11-28' } },
          );
          if (existingSecret.status === 200) throw new Error('CPU_RUNNER_ALREADY_ENROLLED');
          if (existingSecret.status !== 404) throw new Error('GITHUB_SECRET_STATE_UNAVAILABLE');

          const ledgerPost = async (path, body) => {
            const response = await fetch(origin + path, {
              method: 'POST',
              redirect: 'error',
              signal: AbortSignal.timeout(15000),
              headers: { authorization: 'Bearer ' + adminKey, 'content-type': 'application/json', accept: 'application/json' },
              body: JSON.stringify(body),
            });
            let data;
            try { data = await response.json(); } catch { throw new Error('LEDGER_RESPONSE_INVALID'); }
            if (!response.ok || data?.ok !== true) {
              throw new Error('LEDGER_API_' + response.status + '_' + String(data?.error || 'FAILED'));
            }
            return data;
          };

          const publicKey = await github('GET', '/repos/' + repo + '/actions/secrets/public-key');
          if (!publicKey?.key || !publicKey?.key_id) throw new Error('GITHUB_SECRET_PUBLIC_KEY_INVALID');

          const runnerVariables = {
            MIDAD_CONTINUITY_LEDGER_URL: origin,
            MIDAD_CONTINUITY_OWNER_ID: ownerId,
          };
          for (const [name, value] of Object.entries(runnerVariables)) {
            const existing = await fetch('https://api.github.com/repos/' + repo + '/actions/variables/' + name, {
              headers: { authorization: 'Bearer ' + ghToken, accept: 'application/vnd.github+json', 'x-github-api-version': '2022-11-28' },
            });
            if (existing.status === 200) {
              await github('PATCH', '/repos/' + repo + '/actions/variables/' + name, { value });
            } else if (existing.status === 404) {
              await github('POST', '/repos/' + repo + '/actions/variables', { name, value });
            } else {
              throw new Error('GITHUB_VARIABLE_STATE_UNAVAILABLE');
            }
          }

          const enrolled = await ledgerPost('/v1/nodes/enroll', {
            node_id: nodeId,
            owner_id: ownerId,
            consent_confirmed: true,
            capabilities: ['cpu-batch'],
          });
          const enrollmentToken = enrolled.enrollment_token;
          if (enrolled.node_id !== nodeId || typeof enrollmentToken !== 'string' || !/^[a-f0-9]{64}$/i.test(enrollmentToken)) {
            throw new Error('NODE_ENROLLMENT_RESPONSE_INVALID');
          }
          process.stdout.write('::add-mask::' + enrollmentToken + '\n');

          const sealed = sodium.crypto_box_seal(
            sodium.from_string(enrollmentToken),
            sodium.from_base64(publicKey.key, sodium.base64_variants.ORIGINAL),
          );
          await github('PUT', '/repos/' + repo + '/actions/secrets/' + secretName, {
            encrypted_value: sodium.to_base64(sealed, sodium.base64_variants.ORIGINAL),
            key_id: publicKey.key_id,
          });

          const taskId = 'mncf-cpu-smoke-' + runId;
          const eventId = 'mncf-cpu-event-' + runId;
          const task = await ledgerPost('/v1/tasks/enqueue', {
            task_id: taskId,
            owner_id: ownerId,
            idempotency_key: 'mncf-cpu-smoke:' + runId,
            payload: { operation: 'RUNNER_SMOKE', input: {} },
            workload: 'CPU_BATCH',
            required_capabilities: [],
            min_cpu_cores: 1,
            min_memory_mb: 512,
            units: 1,
            estimated_seconds_per_unit: 2,
            max_cost_usd: 0,
            retry_mode: 'AT_LEAST_ONCE_IDEMPOTENT',
            max_attempts: 1,
          });
          if (task.task_id !== taskId || !['QUEUED','COMPLETED'].includes(task.state)) {
            throw new Error('SMOKE_TASK_ENQUEUE_NOT_CONFIRMED');
          }

          await github('POST', '/repos/' + repo + '/actions/workflows/midad-mncf-ephemeral-runner.yml/dispatches', {
            ref: 'main',
            inputs: { owner_id: ownerId, task_id: taskId, event_id: eventId },
          });

          process.stdout.write(JSON.stringify({
            status: 'ENROLLED_AND_DISPATCHED',
            node_id: nodeId,
            owner_id: ownerId,
            capability: 'cpu-batch',
            task_id: taskId,
            task_state: task.state,
            runner_workflow: 'midad-mncf-ephemeral-runner.yml',
            enrollment_token_stored_as_repository_secret: true,
            ledger_url_stored_as_repository_variable: true,
          }) + '\n');
          NODE
