name: MIDAD Continuity Vault Contract

on:
  pull_request:
    paths:
      - "mobile/factory/x/continuity-ledger/**"
      - "mobile/factory/x/tests/continuity-vault.test.mjs"
      - ".github/workflows/midad-continuity-vault-tests.yml"
  push:
    branches: [main]
    paths:
      - "mobile/factory/x/continuity-ledger/**"
      - "mobile/factory/x/tests/continuity-vault.test.mjs"
      - ".github/workflows/midad-continuity-vault-tests.yml"

permissions:
  contents: read

jobs:
  vault-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Run Vault broker and existing Continuity Ledger tests
        run: |
          node --test mobile/factory/x/tests/continuity-vault.test.mjs mobile/factory/x/tests/continuity-ledger.test.mjs
      - name: Validate Continuity Ledger syntax
        run: node --check mobile/factory/x/continuity-ledger/worker.mjs
      - name: Diff whitespace validation
        run: git diff --check
