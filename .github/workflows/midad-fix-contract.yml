name: MIDAD FIX Contract

on:
  push:
    branches: [main, "midad-fix/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Parse active and additive JavaScript
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const files = ['midad-control-v2.js','midad-human-bridge-control.js','midad-fix-v1.js','iaitrader.js','midad-cockpit.js','mobile/web/meme-trader/meme-trader.js'];
          const memeHtml=fs.readFileSync('meme-scout.html','utf8');
          for(const m of memeHtml.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/gi)) if(m[1].trim()) new Function(m[1]);
          for (const f of files) {
            if (!fs.existsSync(f)) throw new Error('Missing JS file: '+f);
            new Function(fs.readFileSync(f,'utf8'));
          }
          console.log('MIDAD_FIX_JS_SYNTAX_OK');
          NODE
      - name: Verify page, cache and UX contracts
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const fail=m=>{throw new Error(m)};
          const html=fs.readFileSync('index.html','utf8');
          const css=fs.readFileSync('midad-fix-v1.css','utf8');
          const js=fs.readFileSync('midad-fix-v1.js','utf8');
          const sw=fs.readFileSync('service-worker.js','utf8');
          for(const x of ['midad-control-v2.css','midad-control-v2.js','midad-human-bridge-control.js','midad-fix-v1.css','midad-fix-v1.js','telegram-web-app.js']) if(!html.includes(x)) fail('index.html missing '+x);
          const controlJs=fs.readFileSync('midad-control-v2.js','utf8');
          if(!controlJs.includes('url:"https://froegigfmpmvtecztfbf.supabase.co"')) fail('Control Room Supabase project URL mismatch');
          if(controlJs.includes('https://froegigfmpmvtecztfb.supabase.co')) fail('Known truncated Supabase project URL reintroduced');
          if(!html.includes('midad-control-v2.js?v=20261011-fix2')) fail('Control Room JS cache-buster not refreshed');
          if(!html.includes('lang="ar" dir="rtl"')) fail('Arabic RTL contract missing');
          if(!css.includes('.navbtn span{font-size:11px')) fail('Readable bottom navigation contract missing');
          if(!css.includes('#midadLiveOps.mlo-hidden{display:none!important}')) fail('LIVE OPS containment contract missing');
          if(!js.includes('aria-current')) fail('Accessible active navigation contract missing');
          if(!js.includes('midad_fix_live_ops_mobile_open')) fail('LIVE OPS restore preference missing');
          if(!sw.includes('midad-control-v7-20261011-meme-scout')) fail('Service worker cache version not bumped');
          if(!sw.includes('./meme-scout.html')) fail('Meme Scout page missing from service-worker precache');
          const meme=fs.readFileSync('meme-scout.html','utf8');
          if(!meme.includes('midad_meme_scout')) fail('Meme Scout backend binding missing');
          if(!meme.includes('LIVE DISABLED') || !meme.includes('MIDAD_SESSION_REQUIRED')) fail('Meme Scout financial/session safety gates missing');
          if(!controlJs.includes('data-cmd="memeScout"')) fail('Control Room Meme Scout launcher missing');
          for(const f of ['midad-fix-v1.css','midad-fix-v1.js','midad-human-bridge-control.js']) if(!sw.includes(f)) fail('Service worker precache missing '+f);
          const publicFiles=[html,css,js,sw,meme];
          if(publicFiles.some(s=>/-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----/.test(s))) fail('Private key material found in public assets');
          if(publicFiles.some(s=>/SUPABASE_SERVICE_ROLE_KEY\s*[:=]\s*['"][^'"]+['"]/.test(s))) fail('Hard-coded service role key pattern found');
          console.log('MIDAD_FIX_UI_CACHE_SECURITY_CONTRACT_OK');
          NODE
      - name: Preserve critical product gates
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const html=fs.readFileSync('iaitrader.html','utf8');
          const manifest=JSON.parse(fs.readFileSync('mobile/factory/products/midad-mobile.json','utf8'));
          if(manifest.app_id!=='ai.midad.mobile') throw new Error('Canonical Android app ID changed');
          if(manifest.features?.live_financial_execution!==false) throw new Error('Live financial execution gate weakened');
          if(!html.includes('midad_iaitrader_station')) throw new Error('Canonical iAiTrader API binding missing');
          console.log('MIDAD_CRITICAL_GATES_OK');
          NODE

      - name: Verify standalone Meme Trader Android product
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const fail=m=>{throw new Error(m)};
          const manifest=JSON.parse(fs.readFileSync('mobile/factory/products/midad-meme-trader.json','utf8'));
          const html=fs.readFileSync('mobile/web/meme-trader/index.html','utf8');
          const css=fs.readFileSync('mobile/web/meme-trader/meme-trader.css','utf8');
          const js=fs.readFileSync('mobile/web/meme-trader/meme-trader.js','utf8');
          if(manifest.product_key!=='midad-meme-trader') fail('Meme Trader factory key mismatch');
          if(manifest.app_id!=='ai.midad.meme.trader') fail('Meme Trader must have its own Android application ID');
          if(manifest.web_entry!=='mobile/web/meme-trader/index.html') fail('Meme Trader web entry is not standalone');
          if(manifest.features?.server_side_secrets_only!==true) fail('Meme Trader server-side secret boundary missing');
          if(manifest.features?.live_financial_execution!==false || manifest.features?.wallet_signing!==false) fail('Live trading safety gate weakened');
          if(manifest.features?.paper_trading!==true) fail('Paper trading feature missing');
          if(!html.includes('lang="ar" dir="rtl"')) fail('Arabic RTL UI missing');
          if(!html.includes('No Control Room session required')) fail('Standalone app independence contract missing');
          if(!html.includes('trade-dialog') || !html.includes('view-portfolio')) fail('Trading and portfolio surfaces missing');
          if(!js.includes('/token-profiles/latest/v1') || !js.includes('/tokens/v1/')) fail('Public DEX market-data integration missing');
          if(!js.includes('BUY_PAPER') || !js.includes('SELL_PAPER')) fail('Local paper-trade ledger missing');
          if(/control_session_token|midad-control-v2|meme-scout\.html/.test(html+js)) fail('Standalone app depends on the Control Room module/session');
          if(!css.includes('.token-card') || !css.includes('@media(max-width:760px)')) fail('Mobile responsive styles missing');
          if(/-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----/.test(html+css+js)) fail('Private key material found in app assets');
          console.log('MIDAD_MEME_TRADER_STANDALONE_CONTRACT_OK');
          NODE
