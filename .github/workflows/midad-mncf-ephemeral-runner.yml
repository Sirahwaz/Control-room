name: MIDAD MNCF — Ephemeral CPU Task Runner

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      event_id:
        description: Durable Continuity wake event identifier
        required: true
        type: string
      task_id:
        description: Exact task to claim
        required: true
        type: string
      owner_id:
        description: Expected task owner identity
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: midad-mncf-task-${{ inputs.task_id }}
  cancel-in-progress: false

jobs:
  execute:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || (github.event_name == 'schedule' && vars.MIDAD_CONTINUITY_OWNER_ID != ''))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout trusted main worker code
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Claim, execute and complete one bounded CPU task
        env:
          MIDAD_CONTINUITY_LEDGER_URL: ${{ vars.MIDAD_CONTINUITY_LEDGER_URL }}
          MIDAD_CONTINUITY_OWNER_ID: ${{ vars.MIDAD_CONTINUITY_OWNER_ID }}
          MIDAD_CONTINUITY_RUNNER_NODE_TOKEN: ${{ secrets.MIDAD_CONTINUITY_RUNNER_NODE_TOKEN }}
          MIDAD_EVENT_ID: ${{ inputs.event_id }}
          MIDAD_TASK_ID: ${{ inputs.task_id }}
          MIDAD_INPUT_OWNER_ID: ${{ github.event_name == 'schedule' && vars.MIDAD_CONTINUITY_OWNER_ID || inputs.owner_id }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${MIDAD_CONTINUITY_LEDGER_URL:-}" ||
                -z "${MIDAD_CONTINUITY_OWNER_ID:-}" ||
                -z "${MIDAD_CONTINUITY_RUNNER_NODE_TOKEN:-}" ]]; then
            echo "MIDAD_CPU_RUNNER_NOT_ENROLLED — scheduled/dispatch run skipped without claiming work"
            exit 0
          fi
          test "$MIDAD_CONTINUITY_OWNER_ID" = "$MIDAD_INPUT_OWNER_ID"
          if [[ -n "${MIDAD_TASK_ID:-}" || -n "${MIDAD_EVENT_ID:-}" ]]; then
            test -n "$MIDAD_TASK_ID"
            test -n "$MIDAD_EVENT_ID"
          else
            echo "MIDAD_CPU_RUNNER_PULL_MODE — claiming at most one eligible task for the enrolled owner"
          fi
          node mobile/factory/x/ephemeral-runner.mjs
