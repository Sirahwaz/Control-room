name: MIDAD MNCF — Ephemeral Linux Task Runner

on:
  workflow_dispatch:
    inputs:
      event_id:
        description: Durable Continuity wake event identifier
        required: true
        type: string
      task_id:
        description: Exact task to claim
        required: true
        type: string
      owner_id:
        description: Expected task owner identity
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: midad-mncf-task-${{ inputs.task_id }}
  cancel-in-progress: false

jobs:
  execute:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout trusted main worker code
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Claim, execute and complete one bounded CPU task
        env:
          MIDAD_CONTINUITY_LEDGER_URL: ${{ vars.MIDAD_CONTINUITY_LEDGER_URL }}
          MIDAD_CONTINUITY_OWNER_ID: ${{ vars.MIDAD_CONTINUITY_OWNER_ID }}
          MIDAD_CONTINUITY_RUNNER_NODE_TOKEN: ${{ secrets.MIDAD_CONTINUITY_RUNNER_NODE_TOKEN }}
          MIDAD_EVENT_ID: ${{ inputs.event_id }}
          MIDAD_TASK_ID: ${{ inputs.task_id }}
          MIDAD_INPUT_OWNER_ID: ${{ inputs.owner_id }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$MIDAD_CONTINUITY_LEDGER_URL"
          test -n "$MIDAD_CONTINUITY_OWNER_ID"
          test -n "$MIDAD_CONTINUITY_RUNNER_NODE_TOKEN"
          test "$MIDAD_CONTINUITY_OWNER_ID" = "$MIDAD_INPUT_OWNER_ID"
          node mobile/factory/x/ephemeral-runner.mjs
