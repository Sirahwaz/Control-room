name: MIDAD Mobile Android
on:
  workflow_dispatch:
    inputs:
      product:
        description: "Factory product key"
        required: true
        default: "midad-mobile"
        type: string
      release_mode:
        description: "debug uses an ephemeral key; release requires the permanent GitHub Actions keystore secrets"
        required: true
        default: "debug"
        type: choice
        options:
          - debug
          - release
  pull_request:
    branches: ["main"]
    paths:
      - "mobile/**"
      - "index.html"
      - "iaitrader.html"
      - "iaitrader.css"
      - "iaitrader.js"
      - "viabtc.html"
      - "viabtc-monitor.css"
      - "viabtc-monitor.js"
      - "viabtc-neuralpp-v1.css"
      - "viabtc-neuralpp-v1.js"
      - "revenue-forge.html"
      - "revenue/**"
      - "assets/**"
      - "*.js"
      - "*.css"
      - "*.svg"
      - "*.webmanifest"
      - ".github/workflows/midad-mobile-android.yml"
  push:
    branches: ["main"]
    paths:
      - "mobile/**"
      - "index.html"
      - "iaitrader.html"
      - "iaitrader.css"
      - "iaitrader.js"
      - "viabtc.html"
      - "viabtc-monitor.css"
      - "viabtc-monitor.js"
      - "viabtc-neuralpp-v1.css"
      - "viabtc-neuralpp-v1.js"
      - "revenue-forge.html"
      - "revenue/**"
      - "assets/**"
      - "*.js"
      - "*.css"
      - "*.svg"
      - "*.webmanifest"
      - ".github/workflows/midad-mobile-android.yml"
permissions:
  contents: read
jobs:
  agentation-ui-feedback:
    name: Verify selected Android product UI before APK build
    uses: ./.github/workflows/agentation-e2e.yml
    with:
      product_key: ${{ github.event_name == 'workflow_dispatch' && inputs.product || 'auto' }}

  build-release-apk:
    needs: agentation-ui-feedback
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout MIDAD
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup Node 24
        uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Resolve Factory product
        id: product
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${{ github.event.inputs.product }}" ]; then
            product="${{ github.event.inputs.product }}"
          else
            product="midad-mobile"
            changed="$(git diff --name-only "${{ github.sha }}^" "${{ github.sha }}" || true)"
            if echo "$changed" | grep -Fxq 'mobile/factory/products/midad-meme-trader.json' || echo "$changed" | grep -Fxq 'mobile/factory/meme-trader-smoke.mjs' || echo "$changed" | grep -Eq '^mobile/web/meme-trader/'; then
              product="midad-meme-trader"
            elif echo "$changed" | grep -Fxq 'mobile/factory/products/signalscan-ai.json' || echo "$changed" | grep -Eq '^mobile/web/signalscan/'; then
              product="signalscan-ai"
            elif echo "$changed" | grep -Fxq 'mobile/factory/products/midad-mobile-next.json' || echo "$changed" | grep -Eq '^mobile/web/(index.html|mobile-hub\\.(js|css)|morph-engine\\.js|midad-browser-mesh\\.(html|js|css)|human-bridge\\.(html|js|css))
          fi
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.release_mode }}" = "release" ] && [ "$product" != "midad-mobile-next" ]; then
            echo "Permanent releases must use product midad-mobile-next (ai.midad.mobile.next); v0.4.1 keeps its original package identity." >&2
            exit 1
          fi
          node mobile/factory/render.mjs "$product" > product.json
          jq -e '.features.server_side_secrets_only == true' mobile/factory/runtime-product.json >/dev/null
          jq -e '.product_key == $p' --arg p "$product" mobile/factory/runtime-product.json >/dev/null
          {
            echo "product=$product"
            echo "display_name=$(jq -r '.display_name' mobile/factory/runtime-product.json)"
            echo "version=$(jq -r '.version' mobile/factory/runtime-product.json)"
            echo "app_id=$(jq -r '.app_id' mobile/factory/runtime-product.json)"
            echo "artifact_name=$(jq -r '.artifact_name' mobile/factory/runtime-product.json)"
            echo "release_channel=$(jq -r '.release_channel' mobile/factory/runtime-product.json)"
            echo "web_entry=$(jq -r '.web_entry' mobile/factory/runtime-product.json)"
          } >> "$GITHUB_OUTPUT"
          cat product.json
      - name: Setup Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - name: Prepare Android SDK
        shell: bash
        run: |
          set -euo pipefail
          ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
      - name: Install Capacitor dependencies
        working-directory: mobile
        run: npm install --no-fund --no-audit
      - name: Prepare bundled product web surface
        shell: bash
        run: |
          set -euo pipefail
          rm -rf mobile/www
          mkdir -p mobile/www/site
          ENTRY="$(jq -r '.web_entry' mobile/factory/runtime-product.json)"
          test -f "$ENTRY"
          cp "$ENTRY" mobile/www/index.html
          while IFS= read -r asset; do
            [ -z "$asset" ] && continue
            test -f "$asset"
            cp "$asset" mobile/www/
          done < <(jq -r '.web_assets[]?' mobile/factory/runtime-product.json)
          # The Mobile Hub routes native users into the canonical Control Room
          # and sibling station pages under ./site/. Bundle tracked root-level
          # web entrypoints/assets there, preserving their relative filenames.
          while IFS= read -r asset; do
            [ -z "$asset" ] && continue
            mkdir -p "mobile/www/site"
            cp "$asset" "mobile/www/site/"
          done < <(git ls-files '*.html' '*.css' '*.js' '*.svg' '*.webmanifest' '*.png' '*.jpg' '*.webp' '*.ico' '*.woff' '*.woff2' | awk 'index($0, "/") == 0')
          # Preserve nested relative paths for first-party Revenue Forge and shared assets.
          while IFS= read -r asset; do
            [ -z "$asset" ] && continue
            mkdir -p "mobile/www/site/$(dirname "$asset")"
            cp "$asset" "mobile/www/site/$asset"
          done < <(git ls-files | grep -E '^(revenue|assets)/' | grep -Ei '\.(html|css|js|svg|webmanifest|png|jpe?g|webp|ico|woff2?)$' || true)
          # Fail the build if any primary Mobile Hub destination or nested checkout asset is absent.
          for required in index.html midad-control-v2.js midad-control-v2.css iaitrader.html viabtc.html revenue-forge.html revenue/checkout-attribution.js revenue/checkout-key.js; do
            test -s "mobile/www/site/$required" || { echo "Missing bundled MIDAD station: $required"; exit 1; }
          done
          grep -Fq './midad-control-v2.js' mobile/www/site/index.html
      - name: Install Playwright for Meme Trader runtime smoke
        if: steps.product.outputs.product == 'midad-meme-trader'
        working-directory: mobile
        run: npm install --no-save --no-audit --no-fund playwright
      - name: Install Chromium for Meme Trader runtime smoke
        if: steps.product.outputs.product == 'midad-meme-trader'
        working-directory: mobile
        run: npx playwright install --with-deps chromium
      - name: Run bundled Meme Trader mobile smoke tests
        if: steps.product.outputs.product == 'midad-meme-trader'
        run: node mobile/factory/meme-trader-smoke.mjs

      - name: Add Android platform
        working-directory: mobile
        run: npx cap add android
      - name: Sync web assets
        working-directory: mobile
        run: npx cap sync android
      - name: Set Android version metadata
        working-directory: mobile
        shell: bash
        run: |
          set -euo pipefail
          VERSION_NAME="$(jq -r '.version' factory/runtime-product.json)"
          VERSION_CODE="$(node -e 'const v=process.argv[1].split(".").map(Number); console.log(v[0]*10000+v[1]*100+v[2])' "$VERSION_NAME")"
          export VERSION_NAME VERSION_CODE
          python3 - <<'PY'
          from pathlib import Path
          import os, re
          p=Path("android/app/build.gradle")
          s=p.read_text()
          if len(re.findall(r'\bversionCode\s+\d+',s)) != 1: raise SystemExit("Expected exactly one versionCode")
          if len(re.findall(r'\bversionName\s+"[^"]+"',s)) != 1: raise SystemExit("Expected exactly one versionName")
          s=re.sub(r'\bversionCode\s+\d+',f'versionCode {os.environ["VERSION_CODE"]}',s,count=1)
          s=re.sub(r'\bversionName\s+"[^"]+"',f'versionName "{os.environ["VERSION_NAME"]}"',s,count=1)
          p.write_text(s)
          PY
      - name: Factory quality gate
        run: node mobile/factory/quality-gate.mjs "${{ steps.product.outputs.product }}"
      - name: Product JavaScript syntax audit
        shell: bash
        run: |
          set -euo pipefail
          for f in mobile/web/signalscan/signalscan.js mobile/web/meme-trader/meme-trader.js mobile/web/omni-agent.js; do
            [ -f "$f" ] && node --check "$f"
          done
      - name: Build unsigned release APK
        working-directory: mobile/android
        run: ./gradlew assembleRelease --no-daemon --stacktrace
      - name: Sign APK (permanent release or isolated debug)
        id: signing
        shell: bash
        env:
          RELEASE_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.release_mode || 'debug' }}
          MIDAD_ANDROID_KEYSTORE_BASE64: ${{ secrets.MIDAD_ANDROID_KEYSTORE_BASE64 }}
          MIDAD_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.MIDAD_ANDROID_KEYSTORE_PASSWORD }}
          MIDAD_ANDROID_KEY_ALIAS: ${{ secrets.MIDAD_ANDROID_KEY_ALIAS }}
          MIDAD_ANDROID_KEY_PASSWORD: ${{ secrets.MIDAD_ANDROID_KEY_PASSWORD }}
          ARTIFACT_NAME: ${{ steps.product.outputs.artifact_name }}
        run: |
          set -euo pipefail
          umask 077
          APK_SRC="mobile/android/app/build/outputs/apk/release/app-release-unsigned.apk"
          test -s "$APK_SRC"
          mkdir -p dist signing
          trap 'rm -rf signing; unset MIDAD_ANDROID_KEYSTORE_PASSWORD MIDAD_ANDROID_KEY_PASSWORD' EXIT
          APKSIGNER="$(find "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$APKSIGNER"
          if [ "$RELEASE_MODE" = "release" ]; then
            for name in MIDAD_ANDROID_KEYSTORE_BASE64 MIDAD_ANDROID_KEYSTORE_PASSWORD MIDAD_ANDROID_KEY_ALIAS MIDAD_ANDROID_KEY_PASSWORD; do
              if [ -z "${!name:-}" ]; then echo "Missing required permanent signing secret: $name" >&2; exit 1; fi
            done
            printf '%s' "$MIDAD_ANDROID_KEYSTORE_BASE64" | base64 --decode > signing/midad-release.jks
            test -s signing/midad-release.jks
            KEYSTORE_INFO="$(keytool -list -keystore signing/midad-release.jks -storepass "$MIDAD_ANDROID_KEYSTORE_PASSWORD" -alias "$MIDAD_ANDROID_KEY_ALIAS" 2>&1)"
            KEYSTORE_TYPE="$(printf '%s\\n' "$KEYSTORE_INFO" | sed -n 's/^Keystore type: //p' | head -n 1)"
            case "$KEYSTORE_TYPE" in
              JKS|PKCS12) ;;
              *) echo "Unsupported or undetected Android keystore type: $KEYSTORE_TYPE" >&2; exit 1 ;;
            esac
            "$APKSIGNER" sign --ks signing/midad-release.jks --ks-type "$KEYSTORE_TYPE" --ks-pass "pass:$MIDAD_ANDROID_KEYSTORE_PASSWORD" --key-pass "pass:$MIDAD_ANDROID_KEY_PASSWORD" --ks-key-alias "$MIDAD_ANDROID_KEY_ALIAS" --out "dist/${ARTIFACT_NAME}-release.apk" "$APK_SRC"
            echo "signing_mode=permanent" >> "$GITHUB_OUTPUT"
          elif [ "$RELEASE_MODE" = "debug" ]; then
            SIGNING_PASS="$(openssl rand -hex 32)"
            echo "::add-mask::$SIGNING_PASS"
            keytool -genkeypair -v -keystore signing/midad-debug-temporary.jks -storepass "$SIGNING_PASS" -keypass "$SIGNING_PASS" -alias midad-debug -keyalg RSA -keysize 2048 -validity 3650 -dname "CN=MIDAD Mobile Debug, OU=MIDAD, O=MIDAD, L=Global, ST=Global, C=XX"
            "$APKSIGNER" sign --ks signing/midad-debug-temporary.jks --ks-pass "pass:$SIGNING_PASS" --key-pass "pass:$SIGNING_PASS" --ks-key-alias midad-debug --out "dist/${ARTIFACT_NAME}-debug.apk" "$APK_SRC"
            unset SIGNING_PASS
            echo "signing_mode=ephemeral-debug" >> "$GITHUB_OUTPUT"
          else
            echo "Unsupported release_mode: $RELEASE_MODE" >&2
            exit 1
          fi
          SIGNED_APK="$(find dist -maxdepth 1 -type f -name '*.apk' -print -quit)"
          test -s "$SIGNED_APK"
          echo "apk_path=$SIGNED_APK" >> "$GITHUB_OUTPUT"
          "$APKSIGNER" verify --verbose --print-certs "$SIGNED_APK"
          AAPT="$(find "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          test -x "$AAPT"
          BADGING="$("$AAPT" dump badging "$SIGNED_APK")"
          echo "$BADGING" | grep -F "package: name='${{ steps.product.outputs.app_id }}'" >/dev/null
          echo "$BADGING" | grep -F "versionName='${{ steps.product.outputs.version }}'" >/dev/null
          echo "ANDROID_PACKAGE_ID_AND_VERSION_VERIFIED"
          sha256sum "$SIGNED_APK" | tee "$SIGNED_APK.sha256"
          cp mobile/factory/runtime-product.json dist/product-manifest.json
          cp mobile/factory/runtime-factory.json dist/factory-runtime.json
      - name: Enable KVM for Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install and launch signed APK on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          disable-animations: true
          script: bash mobile/factory/android-runtime-smoke.sh "${{ steps.product.outputs.app_id }}" "${{ steps.signing.outputs.apk_path }}"

      - name: Upload runtime smoke failure report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.product.outputs.artifact_name }}-runtime-smoke-diagnostics
          path: dist/runtime-smoke-report.json
          if-no-files-found: ignore

      - name: Write build/test/learning reports
        shell: bash
        run: |
          set -euo pipefail
          cat > dist/build-report.json <<EOF
          {"product_key":"${{ steps.product.outputs.product }}","version":"${{ steps.product.outputs.version }}","build_status":"PASSED","factory_quality_gate":"PASSED","signing_mode":"${{ steps.signing.outputs.signing_mode }}"}
          EOF
          RUNTIME_SMOKE="PASSED"
          cat > dist/test-report.json <<EOF
          {"product_key":"${{ steps.product.outputs.product }}","static_js_syntax":"PASSED","secret_scan":"PASSED","artifact_verification":"PASSED","package_id_and_version":"PASSED","runtime_smoke":"$RUNTIME_SMOKE"}
          EOF
          cat > dist/learning-report.json <<EOF
          {"product_key":"${{ steps.product.outputs.product }}","factory_learning":"ENABLED","post_release_outcome":"PENDING"}
          EOF
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.product.outputs.artifact_name }}-release-${{ steps.signing.outputs.signing_mode }}
          path: |
            dist/*.apk
            dist/*.sha256
            dist/product-manifest.json
            dist/factory-runtime.json
            dist/build-report.json
            dist/test-report.json
            dist/runtime-smoke-report.json
            dist/learning-report.json
; then
              product="midad-mobile-next"
            fi
          fi
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.release_mode }}" = "release" ] && [ "$product" != "midad-mobile-next" ]; then
            echo "Permanent releases must use product midad-mobile-next (ai.midad.mobile.next); v0.4.1 keeps its original package identity." >&2
            exit 1
          fi
