name: MIDAD Mobile Android

on:
  workflow_dispatch:
    inputs:
      product:
        description: "Factory product key"
        required: true
        default: "midad-mobile"
        type: string
  push:
    branches: ["main"]
    paths:
      - "mobile/**"
      - "index.html"
      - "iaitrader.html"
      - "iaitrader.css"
      - "iaitrader.js"
      - "viabtc.html"
      - "viabtc-monitor.css"
      - "viabtc-monitor.js"
      - "viabtc-neuralpp-v1.css"
      - "viabtc-neuralpp-v1.js"
      - "revenue-forge.html"
      - "*.js"
      - "*.css"
      - "*.svg"
      - "*.webmanifest"
      - ".github/workflows/midad-mobile-android.yml"

permissions:
  contents: read

jobs:
  build-release-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout MIDAD
        uses: actions/checkout@v7

      - name: Setup Node 24
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Resolve Factory product
        id: product
        shell: bash
        run: |
          set -euo pipefail
          product="${{ github.event.inputs.product || 'midad-mobile' }}"
          node mobile/factory/render.mjs "$product" > product.json
          jq -e '.features.server_side_secrets_only == true' mobile/factory/runtime-product.json >/dev/null
          jq -e '.product_key == $p' --arg p "$product" mobile/factory/runtime-product.json >/dev/null
          {
            echo "product=$product"
            echo "display_name=$(jq -r '.display_name' mobile/factory/runtime-product.json)"
            echo "version=$(jq -r '.version' mobile/factory/runtime-product.json)"
            echo "app_id=$(jq -r '.app_id' mobile/factory/runtime-product.json)"
            echo "artifact_name=$(jq -r '.artifact_name' mobile/factory/runtime-product.json)"
            echo "release_channel=$(jq -r '.release_channel' mobile/factory/runtime-product.json)"
          } >> "$GITHUB_OUTPUT"
          cat product.json

      - name: Setup Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Prepare Android SDK
        shell: bash
        run: |
          set -euo pipefail
          ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

      - name: Install Capacitor dependencies
        working-directory: mobile
        run: npm install --no-fund --no-audit

      - name: Prepare bundled MIDAD web surfaces
        run: |
          set -euo pipefail
          rm -rf mobile/www
          mkdir -p mobile/www/site
          cp mobile/web/index.html mobile/www/index.html
          cp mobile/web/mobile-hub.css mobile/www/mobile-hub.css
          cp mobile/web/mobile-hub.js mobile/www/mobile-hub.js
          cp mobile/web/morph-engine.js mobile/www/morph-engine.js
          cp mobile/factory/morph-registry.json mobile/www/morph-registry.json
          node mobile/factory/morph-engine.smoke.mjs

          # Preserve the existing web product intact and bundle it as a local site layer.
          find . -maxdepth 1 -type f \( -name "*.html" -o -name "*.css" -o -name "*.js" -o -name "*.svg" -o -name "*.webmanifest" \) \
            -not -path "./mobile/*" \
            -exec cp {} mobile/www/site/ \;

      - name: Add Android platform
        working-directory: mobile
        run: npx cap add android

      - name: Sync web assets
        working-directory: mobile
        run: npx cap sync android

      - name: Build unsigned release APK
        working-directory: mobile/android
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Sign release APK for installability
        shell: bash
        run: |
          set -euo pipefail
          APK_SRC="mobile/android/app/build/outputs/apk/release/app-release-unsigned.apk"
          test -f "$APK_SRC"
          mkdir -p dist signing
          keytool -genkeypair -v \
            -keystore signing/midad-release-temporary.jks \
            -storepass "midad-temp-release" \
            -keypass "midad-temp-release" \
            -alias midad \
            -keyalg RSA -keysize 2048 -validity 3650 \
            -dname "CN=MIDAD Mobile, OU=MIDAD, O=MIDAD, L=Global, ST=Global, C=XX"
          APKSIGNER="$(find "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$APKSIGNER"
          "$APKSIGNER" sign \
            --ks signing/midad-release-temporary.jks \
            --ks-pass pass:midad-temp-release \
            --key-pass pass:midad-temp-release \
            --ks-key-alias midad \
            --out "dist/${ARTIFACT_NAME}-release.apk" \
            "$APK_SRC"
          "$APKSIGNER" verify --verbose "dist/${ARTIFACT_NAME}-release.apk"
          sha256sum "dist/${ARTIFACT_NAME}-release.apk" | tee "dist/${ARTIFACT_NAME}-release.apk.sha256"
          cp mobile/factory/runtime-product.json dist/product-manifest.json
          rm -rf signing
        env:
          ARTIFACT_NAME: ${{ steps.product.outputs.artifact_name }}

      - name: Collect APK metadata
        shell: bash
        run: |
          set -euo pipefail
          test -f "dist/${ARTIFACT_NAME}-release.apk"
          file "dist/${ARTIFACT_NAME}-release.apk"
        env:
          ARTIFACT_NAME: ${{ steps.product.outputs.artifact_name }}

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.product.outputs.artifact_name }}-release-${{ steps.product.outputs.release_channel }}
          path: |
            dist/*-release.apk
            dist/*-release.apk.sha256
            dist/product-manifest.json
