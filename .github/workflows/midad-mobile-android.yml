            printf '%s' "$MIDAD_ANDROID_KEYSTORE_BASE64" | base64 --decode > signing/midad-release.jks
            test -s signing/midad-release.jks
            KEYSTORE_INFO="$(keytool -list -keystore signing/midad-release.jks -storepass "$MIDAD_ANDROID_KEYSTORE_PASSWORD" -alias "$MIDAD_ANDROID_KEY_ALIAS" 2>&1)"
            KEYSTORE_TYPE="$(printf '%s\\n' "$KEYSTORE_INFO" | sed -n 's/^Keystore type: //p' | head -n 1)"
            case "$KEYSTORE_TYPE" in
              JKS|PKCS12) ;;
              *) echo "Unsupported or undetected Android keystore type: $KEYSTORE_TYPE" >&2; exit 1 ;;
            esac
            "$APKSIGNER" sign --ks signing/midad-release.jks --ks-type "$KEYSTORE_TYPE" --ks-pass "pass:$MIDAD_ANDROID_KEYSTORE_PASSWORD" --key-pass "pass:$MIDAD_ANDROID_KEY_PASSWORD" --ks-key-alias "$MIDAD_ANDROID_KEY_ALIAS" --out "dist/${ARTIFACT_NAME}-release.apk" "$APK_SRC"
            echo "signing_mode=permanent" >> "$GITHUB_OUTPUT"
          elif [ "$RELEASE_MODE" = "debug" ]; then
            SIGNING_PASS="$(openssl rand -hex 32)"
            echo "::add-mask::$SIGNING_PASS"
            keytool -genkeypair -v -keystore signing/midad-debug-temporary.jks -storepass "$SIGNING_PASS" -keypass "$SIGNING_PASS" -alias midad-debug -keyalg RSA -keysize 2048 -validity 3650 -dname "CN=MIDAD Mobile Debug, OU=MIDAD, O=MIDAD, L=Global, ST=Global, C=XX"
            "$APKSIGNER" sign --ks signing/midad-debug-temporary.jks --ks-pass "pass:$SIGNING_PASS" --key-pass "pass:$SIGNING_PASS" --ks-key-alias midad-debug --out "dist/${ARTIFACT_NAME}-debug.apk" "$APK_SRC"
            unset SIGNING_PASS
            echo "signing_mode=ephemeral-debug" >> "$GITHUB_OUTPUT"
          else
            echo "Unsupported release_mode: $RELEASE_MODE" >&2
            exit 1
          fi
          SIGNED_APK="$(find dist -maxdepth 1 -type f -name '*.apk' -print -quit)"
          test -s "$SIGNED_APK"
          echo "apk_path=$SIGNED_APK" >> "$GITHUB_OUTPUT"
          "$APKSIGNER" verify --verbose --print-certs "$SIGNED_APK"
          AAPT="$(find "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          test -x "$AAPT"
          BADGING="$("$AAPT" dump badging "$SIGNED_APK")"
          echo "$BADGING" | grep -F "package: name='${{ steps.product.outputs.app_id }}'" >/dev/null
          echo "$BADGING" | grep -F "versionName='${{ steps.product.outputs.version }}'" >/dev/null
          echo "ANDROID_PACKAGE_ID_AND_VERSION_VERIFIED"
          sha256sum "$SIGNED_APK" | tee "$SIGNED_APK.sha256"
          cp mobile/factory/runtime-product.json dist/product-manifest.json
          cp mobile/factory/runtime-factory.json dist/factory-runtime.json
      - name: Enable KVM for Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install and launch signed APK on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          disable-animations: true
          script: bash mobile/factory/android-runtime-smoke.sh "${{ steps.product.outputs.app_id }}" "${{ steps.signing.outputs.apk_path }}"

      - name: Upload runtime smoke failure report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.product.outputs.artifact_name }}-runtime-smoke-diagnostics
          path: dist/runtime-smoke-report.json
          if-no-files-found: ignore

      - name: Write build/test/learning reports
        shell: bash
        run: |
          set -euo pipefail
          cat > dist/build-report.json <<EOF
          {"product_key":"${{ steps.product.outputs.product }}","version":"${{ steps.product.outputs.version }}","build_status":"PASSED","factory_quality_gate":"PASSED","signing_mode":"${{ steps.signing.outputs.signing_mode }}"}
          EOF
          RUNTIME_SMOKE="PASSED"
          cat > dist/test-report.json <<EOF
          {"product_key":"${{ steps.product.outputs.product }}","static_js_syntax":"PASSED","secret_scan":"PASSED","artifact_verification":"PASSED","package_id_and_version":"PASSED","runtime_smoke":"$RUNTIME_SMOKE"}
          EOF
          cat > dist/learning-report.json <<EOF
          {"product_key":"${{ steps.product.outputs.product }}","factory_learning":"ENABLED","post_release_outcome":"PENDING"}
          EOF
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.product.outputs.artifact_name }}-release-${{ steps.signing.outputs.signing_mode }}
          path: |
            dist/*.apk
            dist/*.sha256
            dist/product-manifest.json
            dist/factory-runtime.json
            dist/build-report.json
            dist/test-report.json
            dist/runtime-smoke-report.json
            dist/learning-report.json
