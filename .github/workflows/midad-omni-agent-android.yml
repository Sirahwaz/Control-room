name: MIDAD Omni Agent Android

on:
  workflow_dispatch: {}
  push:
    branches: ["main"]
    paths:
      - "mobile/web/omni-agent.*"
      - "mobile/web/human-bridge.js"
      - "mobile/factory/**"
      - "mobile/package.json"
      - ".github/workflows/midad-omni-agent-android.yml"

permissions:
  contents: read

jobs:
  build-omni-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout MIDAD
        uses: actions/checkout@v7
      - name: Setup Node 24
        uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Resolve Omni Agent manifest
        id: product
        run: |
          set -euo pipefail
          node mobile/factory/render.mjs midad-omni-agent
          jq -e '.product_key=="midad-omni-agent"' mobile/factory/runtime-product.json >/dev/null
          jq -e '.features.native_agent_engine==true' mobile/factory/runtime-product.json >/dev/null
          jq -e '.features.server_side_secrets_only==true' mobile/factory/runtime-product.json >/dev/null
          VERSION="$(jq -r '.version' mobile/factory/runtime-product.json)"
          ARTIFACT_NAME="$(jq -r '.artifact_name' mobile/factory/runtime-product.json)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "artifact_name=$ARTIFACT_NAME" >> "$GITHUB_OUTPUT"
      - name: Setup Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - name: Prepare Android SDK
        shell: bash
        run: |
          set -euo pipefail
          ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
      - name: Install dependencies
        working-directory: mobile
        run: npm install --no-fund --no-audit
      - name: Prepare Omni Agent web surface
        shell: bash
        run: |
          set -euo pipefail
          rm -rf mobile/www
          mkdir -p mobile/www/site
          cp mobile/web/omni-agent.html mobile/www/index.html
          cp mobile/web/omni-agent.css mobile/www/omni-agent.css
          cp mobile/web/omni-agent.js mobile/www/omni-agent.js
      - name: Add Android platform
        working-directory: mobile
        run: npx cap add android
      - name: Sync Android
        working-directory: mobile
        run: npx cap sync android
      - name: Set version
        working-directory: mobile
        shell: bash
        run: |
          set -euo pipefail
          VERSION_NAME="$(jq -r '.version' factory/runtime-product.json)"
          VERSION_CODE="$(node -e 'const v=process.argv[1].split(".").map(Number); console.log(v[0]*10000+v[1]*100+v[2])' "$VERSION_NAME")"
          export VERSION_NAME VERSION_CODE
          python3 - <<'PY'
          from pathlib import Path
          import os, re
          p=Path("android/app/build.gradle"); s=p.read_text()
          s=re.sub(r'\bversionCode\s+\d+',f'versionCode {os.environ["VERSION_CODE"]}',s,count=1)
          s=re.sub(r'\bversionName\s+"[^"]+"',f'versionName "{os.environ["VERSION_NAME"]}"',s,count=1)
          p.write_text(s)
          PY
      - name: Factory quality gate
        run: node mobile/factory/quality-gate.mjs midad-omni-agent

      - name: Static JS syntax audit
        working-directory: mobile
        run: node --check web/omni-agent.js
      - name: Factory contract audit
        run: |
          set -euo pipefail
          node mobile/factory/render.mjs midad-omni-agent
          VERSION="$(jq -r '.version' mobile/factory/runtime-product.json)"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then exit 1; fi
          jq -e '.features.proactive_execution==true and .features.smart_inspector==true and .features.server_side_secrets_only==true' mobile/factory/runtime-product.json >/dev/null
          jq -e '.web_assets | length >= 2' mobile/factory/runtime-product.json >/dev/null
      - name: Build release APK
        working-directory: mobile/android
        run: ./gradlew assembleRelease --no-daemon --stacktrace
      - name: Sign for installability
        shell: bash
        run: |
          set -euo pipefail
          APK_SRC="mobile/android/app/build/outputs/apk/release/app-release-unsigned.apk"
          test -f "$APK_SRC"
          mkdir -p dist signing
          keytool -genkeypair -v -keystore signing/midad-omni-agent.jks -storepass "midad-temp-release" -keypass "midad-temp-release" -alias midad -keyalg RSA -keysize 2048 -validity 3650 -dname "CN=MIDAD Omni Agent, OU=MIDAD, O=MIDAD, L=Global, ST=Global, C=XX"
          APKSIGNER="$(find "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          OUT="dist/${{ steps.product.outputs.artifact_name }}-release.apk"
          "$APKSIGNER" sign --ks signing/midad-omni-agent.jks --ks-pass pass:midad-temp-release --key-pass pass:midad-temp-release --ks-key-alias midad --out "$OUT" "$APK_SRC"
          "$APKSIGNER" verify --verbose "$OUT"
          sha256sum "$OUT" | tee "$OUT.sha256"
          cp mobile/factory/runtime-product.json dist/product-manifest.json
          rm -rf signing
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.product.outputs.artifact_name }}-release
          path: |
            dist/${{ steps.product.outputs.artifact_name }}-release.apk
            dist/${{ steps.product.outputs.artifact_name }}-release.apk.sha256
            dist/product-manifest.json
