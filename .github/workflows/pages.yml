name: Deploy MIDAD Control Room to GitHub Pages
# Neural++ deployment pulse 2026-10-01
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages-midad
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Build isolated StageShow preview
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install StageShow demo dependencies
        working-directory: lab/stageshow
        run: npm install --no-audit --no-fund
      - name: Typecheck StageShow demo
        working-directory: lab/stageshow
        run: npm run typecheck
      - name: Build StageShow demo
        working-directory: lab/stageshow
        run: npm run build
      - name: Smoke-test StageShow bundle
        working-directory: lab/stageshow
        run: npm run smoke
      - name: Verify root-level preview assets
        run: test -s stageshow-preview.html && test -s stageshow-preview.js && test -s stageshow-preview.css
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
