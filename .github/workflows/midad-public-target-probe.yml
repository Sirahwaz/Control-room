name: MIDAD Browser Mesh — Public Target Probe
on:
  workflow_dispatch:
    inputs:
      target_url:
        description: "Exact public HTTPS URL to inspect (no login or session)"
        required: true
        type: string
      allowed_host:
        description: "Exact hostname only, e.g. example.com (no wildcard)"
        required: true
        type: string
      timeout_ms:
        description: "Navigation timeout in milliseconds (1000–20000)"
        required: true
        default: "10000"
        type: string
  push:
    branches:
      - "feat/midad-public-target-probe-20261028"
  pull_request:
    paths:
      - "tools/midad-browser-runtime/**"
      - ".github/workflows/midad-public-target-probe.yml"
permissions:
  contents: read
jobs:
  policy-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install isolated runtime dependencies
        run: python -m pip install -r tools/midad-browser-runtime/requirements.txt
      - name: Run offline policy, lifecycle, and structural-planner tests
        working-directory: tools/midad-browser-runtime
        run: python -m unittest -v test_runner.py test_public_target_probe.py test_agent_policy.py test_secret_provider.py test_account_registry.py test_operator_command_router.py test_persistent_session.py test_operator_gateway_contract.py test_operator_worker.py
      - name: Assemble secret-free operator worker bundle
        run: |
          set -euo pipefail
          mkdir -p dist/midad-operator-worker
          src=tools/midad-browser-runtime
          dst=dist/midad-operator-worker
          cp "$src/runner.py" "$src/agent_policy.py" "$src/account_registry.py" "$src/secret_provider.py" "$src/operator_command_router.py" "$src/persistent_session.py" "$src/operator_worker.py" "$src/submit_operator_command.py" "$src/requirements.txt" "$dst/"
          cp "$src/account_profiles.example.json" "$dst/accounts.example.json"
          cp "$src/README-OPERATOR-MODE.md" "$dst/README.md"
          cp "$src/deploy/operator-worker.Dockerfile" "$dst/Dockerfile"
          cp "$src/deploy/Procfile" "$dst/Procfile"
          cp "$src/deploy/.env.example" "$dst/.env.example"
          (cd dist && zip -qr midad-operator-worker.zip midad-operator-worker)
      - name: Upload secret-free operator worker bundle
        uses: actions/upload-artifact@v4
        with:
          name: midad-operator-worker-bundle
          path: dist/midad-operator-worker.zip
          if-no-files-found: error
          retention-days: 7
      - name: Build persistent operator worker image (no push)
        run: docker build -t midad-operator-worker:test -f tools/midad-browser-runtime/deploy/operator-worker.Dockerfile tools/midad-browser-runtime
      - name: Install Chromium for a manual public-target probe
        if: github.event_name == 'workflow_dispatch'
        run: python -m playwright install --with-deps chromium
      - name: Probe one explicitly allowlisted public target
        if: github.event_name == 'workflow_dispatch'
        env:
          MIDAD_PROBE_URL: ${{ inputs.target_url }}
          MIDAD_PROBE_ALLOWED_HOST: ${{ inputs.allowed_host }}
        run: |
          python tools/midad-browser-runtime/public_target_probe.py \
            --url "$MIDAD_PROBE_URL" \
            --allowed-host "$MIDAD_PROBE_ALLOWED_HOST" \
            --timeout-ms "${{ inputs.timeout_ms }}"
