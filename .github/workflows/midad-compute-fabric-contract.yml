name: MIDAD Compute Fabric Contract

on:
  push:
    branches:
      - feat/midad-compute-fabric-zero-budget
    paths:
      - 'compute/mncf/**'
      - 'tests/midad-compute-fabric-contract.test.mjs'
      - 'tests/midad-linux-worker.test.mjs'
      - 'tests/midad-continuity-github-runner.test.mjs'
      - '.github/workflows/midad-forge.yml'
      - '.github/workflows/midad-compute-fabric-contract.yml'
      - '.github/workflows/midad-continuity-github-ephemeral-node.yml'
      - '.github/workflows/midad-continuity-cloudflare-deploy.yml'
      - '.github/workflows/midad-mncf-ephemeral-runner.yml'
      - 'mobile/factory/x/ephemeral-runner.mjs'
      - 'mobile/factory/x/tests/continuity-*.test.mjs'
      - 'mobile/factory/x/continuity-ledger/**'
  pull_request:
    paths:
      - 'compute/mncf/**'
      - 'tests/midad-compute-fabric-contract.test.mjs'
      - 'tests/midad-linux-worker.test.mjs'
      - 'tests/midad-continuity-github-runner.test.mjs'
      - '.github/workflows/midad-forge.yml'
      - '.github/workflows/midad-compute-fabric-contract.yml'
      - '.github/workflows/midad-continuity-github-ephemeral-node.yml'
      - '.github/workflows/midad-continuity-cloudflare-deploy.yml'
      - '.github/workflows/midad-mncf-ephemeral-runner.yml'
      - 'mobile/factory/x/ephemeral-runner.mjs'
      - 'mobile/factory/x/tests/continuity-*.test.mjs'
      - 'mobile/factory/x/continuity-ledger/**'

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Validate manifest JSON
        run: node -e "JSON.parse(require('fs').readFileSync('compute/mncf/manifest.json','utf8')); console.log('MNCF_MANIFEST_JSON_OK')"
      - name: MNCF architecture contract tests
        run: node --test tests/midad-compute-fabric-contract.test.mjs
      - name: MIDAD Linux Worker runtime safety tests
        run: node --test tests/midad-linux-worker.test.mjs
      - name: GitHub ephemeral Continuity Runner tests
        run: node --test tests/midad-continuity-github-runner.test.mjs
      - name: Validate GitHub ephemeral runner syntax
        run: node --check compute/mncf/runtime/continuity-github-runner.mjs
      - name: Validate MIDAD Linux Worker runtime syntax
        run: node --check compute/mncf/runtime/worker.mjs
      - name: Diff whitespace validation
        run: git diff --check
