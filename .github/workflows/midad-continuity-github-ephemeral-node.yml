name: MIDAD Continuity — GitHub Ephemeral Node

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: midad-continuity-github-ephemeral-node
  cancel-in-progress: false

jobs:
  poll-and-execute-one:
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Checkout without persisted repository credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Poll Continuity Ledger and execute one bounded public probe
        shell: bash
        env:
          MIDAD_CONTINUITY_LEDGER_URL: ${{ vars.MIDAD_CONTINUITY_LEDGER_URL }}
          MIDAD_CONTINUITY_NODE_ID: ${{ vars.MIDAD_CONTINUITY_NODE_ID }}
          MIDAD_CONTINUITY_OWNER_ID: ${{ vars.MIDAD_CONTINUITY_OWNER_ID }}
          MIDAD_CONTINUITY_NODE_TOKEN: ${{ secrets.MIDAD_CONTINUITY_NODE_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${MIDAD_CONTINUITY_LEDGER_URL:-}" ||
                -z "${MIDAD_CONTINUITY_NODE_ID:-}" ||
                -z "${MIDAD_CONTINUITY_OWNER_ID:-}" ||
                -z "${MIDAD_CONTINUITY_NODE_TOKEN:-}" ]]; then
            echo "MIDAD_CONTINUITY_NODE_NOT_ENROLLED — skipped without starting a task"
            exit 0
          fi
          node compute/mncf/runtime/continuity-github-runner.mjs

