name: SignalScan AI — MIDAD Mobile Factory

on:
  push:
    branches:
      - product/signal-scanner-v0.1.0
    paths:
      - "mobile/factory/products/signal-scanner.json"
      - "mobile/factory/products/signal-scanner-icon.xml"
      - "mobile/factory/product.schema.json"
      - "mobile/factory/factory.config.json"
      - "mobile/factory/render.mjs"
      - "mobile/factory/quality-gate.mjs"
      - "mobile/web/signal-scanner.html"
      - "mobile/web/signal-scanner.css"
      - "mobile/web/signal-scanner.js"
      - "mobile/package.json"
      - "mobile/capacitor.config.json"
      - ".github/workflows/signal-scanner-factory.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-signal-scanner:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node 24
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Resolve SignalScan product
        shell: bash
        run: |
          set -euo pipefail
          node mobile/factory/render.mjs signal-scanner
          jq -e '.product_key=="signal-scanner"' mobile/factory/runtime-product.json >/dev/null
          jq -e '.features.server_side_secrets_only==true' mobile/factory/runtime-product.json >/dev/null
          jq -e '.features.live_financial_execution==false' mobile/factory/runtime-product.json >/dev/null
          jq -e '.app_id=="ai.signalscan.scanner"' mobile/factory/runtime-product.json >/dev/null

      - name: Setup Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Prepare Android SDK
        shell: bash
        run: |
          set -euo pipefail
          ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

      - name: Install dependencies
        working-directory: mobile
        run: npm install --no-fund --no-audit

      - name: Prepare web surface
        shell: bash
        run: |
          set -euo pipefail
          test -f mobile/web/signal-scanner.html
          test -f mobile/web/signal-scanner.css
          test -f mobile/web/signal-scanner.js
          rm -rf mobile/www
          mkdir -p mobile/www
          cp mobile/web/signal-scanner.html mobile/www/index.html
          cp mobile/web/signal-scanner.css mobile/www/
          cp mobile/web/signal-scanner.js mobile/www/

      - name: Add Android platform
        working-directory: mobile
        run: npx cap add android

      - name: Sync Android
        working-directory: mobile
        run: npx cap sync android

      - name: Install product launcher icon
        shell: bash
        run: |
          set -euo pipefail
          SRC="mobile/factory/products/signal-scanner-icon.xml"
          DST="mobile/android/app/src/main/res/drawable/signal_scanner_icon.xml"
          test -f "$SRC"
          mkdir -p "$(dirname "$DST")"
          cp "$SRC" "$DST"
          MANIFEST="mobile/android/app/src/main/AndroidManifest.xml"
          test -f "$MANIFEST"
          python3 - <<'PY'
          from pathlib import Path
          p=Path("mobile/android/app/src/main/AndroidManifest.xml")
          s=p.read_text()
          s=s.replace('android:icon="@mipmap/ic_launcher"', 'android:icon="@drawable/signal_scanner_icon"')
          s=s.replace('android:roundIcon="@mipmap/ic_launcher_round"', 'android:roundIcon="@drawable/signal_scanner_icon"')
          p.write_text(s)
          PY

      - name: Set product version
        working-directory: mobile
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,re
          from pathlib import Path
          m=json.loads(Path("factory/runtime-product.json").read_text())
          version=m["version"]
          code=sum(int(x)*w for x,w in zip(version.split("."),(10000,100,1)))
          p=Path("android/app/build.gradle")
          s=p.read_text()
          s=re.sub(r'\bversionCode\s+\d+',f'versionCode {code}',s,count=1)
          s=re.sub(r'\bversionName\s+"[^"]+"',f'versionName "{version}"',s,count=1)
          p.write_text(s)
          PY

      - name: Factory quality gate
        run: node mobile/factory/quality-gate.mjs signal-scanner

      - name: App JavaScript syntax audit
        working-directory: mobile
        run: node --check web/signal-scanner.js

      - name: Build release APK
        working-directory: mobile/android
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Sign installable APK
        shell: bash
        run: |
          set -euo pipefail
          APK_SRC="mobile/android/app/build/outputs/apk/release/app-release-unsigned.apk"
          test -f "$APK_SRC"
          mkdir -p dist signing
          keytool -genkeypair -v             -keystore signing/signalscan-factory-temp.jks             -storepass "signalscan-factory-temp"             -keypass "signalscan-factory-temp"             -alias signalscanfactory             -keyalg RSA -keysize 2048 -validity 3650             -dname "CN=SignalScan AI Factory, OU=SignalScan AI, O=SignalScan AI, L=Global, ST=Global, C=XX"
          APKSIGNER="$(find "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          OUT="dist/SignalScan-AI-v0.1.0-release.apk"
          "$APKSIGNER" sign             --ks signing/signalscan-factory-temp.jks             --ks-pass pass:signalscan-factory-temp             --key-pass pass:signalscan-factory-temp             --ks-key-alias signalscanfactory             --out "$OUT" "$APK_SRC"
          "$APKSIGNER" verify --verbose "$OUT"
          sha256sum "$OUT" | tee "$OUT.sha256"
          cp mobile/factory/runtime-product.json dist/product-manifest.json
          cp mobile/factory/runtime-factory.json dist/factory-runtime.json
          rm -rf signing

      - name: Runtime/static reports
        shell: bash
        run: |
          set -euo pipefail
          cat > dist/build-report.json <<'EOF'
          {
            "product_key":"signal-scanner",
            "version":"0.1.0",
            "release_channel":"internal",
            "artifact_name":"SignalScan-AI-v0.1.0",
            "factory_quality_gate":"PASSED",
            "build_status":"PASSED"
          }
          EOF
          cat > dist/test-report.json <<'EOF'
          {
            "product_key":"signal-scanner",
            "manifest":"PASSED",
            "security_boundary":"PASSED",
            "javascript_syntax":"PASSED",
            "artifact_signing":"PASSED",
            "runtime_device_smoke":"PENDING"
          }
          EOF
          cat > dist/learning-report.json <<'EOF'
          {
            "product_key":"signal-scanner",
            "learning":"ENABLED",
            "initial_state":"PENDING_USER_FEEDBACK",
            "next_signal":"capture scan outcomes, false positives, UX feedback and retention"
          }
          EOF

      - name: Upload SignalScan build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SignalScan-AI-v0.1.0-release
          path: |
            dist/*.apk
            dist/*.sha256
            dist/*.json
