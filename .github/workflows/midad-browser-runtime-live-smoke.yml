name: MIDAD Browser Mesh — Manual Live Chromium Smoke
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  chromium-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Playwright
        run: |
          python -m pip install -r tools/midad-browser-runtime/requirements.txt
          python -m playwright install --with-deps chromium
      - name: Run real Chromium smoke against public test page
        working-directory: tools/midad-browser-runtime
        run: python live_browser_smoke.py
