name: MIDAD Browser Mesh — Manual Live Chromium Smoke
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "tools/midad-browser-runtime/live_browser_smoke.py"
      - "tools/midad-browser-runtime/runner.py"
      - "tools/midad-browser-runtime/test_runner.py"
      - "tools/midad-browser-runtime/requirements.txt"
      - ".github/workflows/midad-browser-runtime-live-smoke.yml"
permissions:
  contents: read
jobs:
  chromium-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Playwright
        run: |
          python -m pip install -r tools/midad-browser-runtime/requirements.txt
          python -m playwright install --with-deps chromium
      - name: Run Python unit and contract tests
        working-directory: tools/midad-browser-runtime
        run: python -m unittest -v test_runner.py
      - name: Run Chromium smoke and adversarial browser fixtures
        working-directory: tools/midad-browser-runtime
        run: python live_browser_smoke.py
