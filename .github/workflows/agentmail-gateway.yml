name: AgentMail Gateway

on:
  pull_request:
    paths:
      - "supabase/functions/midad_client_gateway/agentmail*"
      - "supabase/functions/midad_client_gateway/outreach-policy*"
      - "supabase/functions/midad_client_gateway/outreach.ts"
      - "supabase/functions/midad_client_gateway/index.ts"
      - "supabase/functions/midad_client_gateway/deno.json"
      - ".github/workflows/agentmail-gateway.yml"
  push:
    branches: [main, 'feat/**']
    paths:
      - "supabase/functions/midad_client_gateway/agentmail*"
      - "supabase/functions/midad_client_gateway/outreach-policy*"
      - "supabase/functions/midad_client_gateway/outreach.ts"
      - "supabase/functions/midad_client_gateway/index.ts"
      - "supabase/functions/midad_client_gateway/deno.json"
      - "supabase/functions/midad_client_gateway/outreach-policy*"
      - "supabase/functions/midad_client_gateway/index.ts"
      - "supabase/functions/midad_client_gateway/deno.json"
      - ".github/workflows/agentmail-gateway.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Lint
        run: deno lint --config supabase/functions/midad_client_gateway/deno.json supabase/functions/midad_client_gateway/agentmail.ts supabase/functions/midad_client_gateway/outreach-policy.mjs supabase/functions/midad_client_gateway/outreach-policy.test.mjs supabase/functions/midad_client_gateway/outreach.ts
      - name: Type check
        run: deno check --config supabase/functions/midad_client_gateway/deno.json supabase/functions/midad_client_gateway/agentmail.ts supabase/functions/midad_client_gateway/agentmail_test.ts supabase/functions/midad_client_gateway/outreach-policy.mjs supabase/functions/midad_client_gateway/outreach-policy.test.mjs supabase/functions/midad_client_gateway/outreach.ts
      - name: Unit tests
        run: deno test --config supabase/functions/midad_client_gateway/deno.json supabase/functions/midad_client_gateway/agentmail_test.ts supabase/functions/midad_client_gateway/outreach-policy.test.mjs
