name: Agentation E2E verification

on:
  pull_request:
    branches: [main]
    paths:
      - ".codex/**"
      - "tools/agentation/**"
      - "mobile/factory/**"
      - "mobile/web/**"
      - "mobile/package.json"
      - "index.html"
      - "*.html"
      - "*.css"
      - "*.js"
      - "*.svg"
      - "*.webmanifest"
      - ".github/workflows/agentation-e2e.yml"
      - ".github/workflows/midad-mobile-factory.yml"
  push:
    branches: [main]
    paths:
      - ".codex/**"
      - "tools/agentation/**"
      - "mobile/factory/**"
      - "mobile/web/**"
      - "mobile/package.json"
      - "index.html"
      - "*.html"
      - "*.css"
      - "*.js"
      - "*.svg"
      - "*.webmanifest"
      - ".github/workflows/agentation-e2e.yml"
      - ".github/workflows/midad-mobile-factory.yml"
  workflow_dispatch:
    inputs:
      product_key:
        description: "Mobile Factory product key to preview"
        required: true
        default: "midad-mobile"
        type: string
  workflow_call:
    inputs:
      product_key:
        description: "Mobile Factory product key to preview"
        required: false
        default: "midad-mobile"
        type: string

permissions:
  contents: read

concurrency:
  group: agentation-e2e-${{ github.event.pull_request.number || inputs.product_key || github.ref }}
  cancel-in-progress: true

jobs:
  browser-to-mcp:
    name: Product UI → Agentation HTTP → MCP
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: tools/agentation/e2e
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: tools/agentation/e2e/package.json

      - name: Prepare selected product WebView preview
        id: preview
        working-directory: .
        env:
          PRODUCT_KEY: ${{ inputs.product_key || 'midad-mobile' }}
        run: |
          set -euo pipefail
          node mobile/factory/agentation/prepare-preview.mjs "$PRODUCT_KEY"
          echo "product_key=$PRODUCT_KEY" >> "$GITHUB_OUTPUT"

      - name: Install isolated test dependencies
        run: npm install --no-audit --no-fund

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Build isolated React preview shell
        run: npm run build

      - name: Start loopback-only Agentation HTTP server
        shell: bash
        run: |
          AGENTATION_STORE=memory node scripts/start-http-server.mjs > "$RUNNER_TEMP/agentation-http.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/agentation-http.pid"
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4747/health >/dev/null; then
              echo "Agentation HTTP health check passed."
              exit 0
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/agentation-http.log"
          echo "Agentation HTTP server did not become healthy." >&2
          exit 1

      - name: Start isolated preview server
        shell: bash
        run: |
          npm run dev -- --port 4173 > "$RUNNER_TEMP/agentation-vite.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/agentation-vite.pid"
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/ >/dev/null; then
              echo "Preview is responding."
              exit 0
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/agentation-vite.log"
          echo "Preview did not become healthy." >&2
          exit 1

      - name: Test product annotation → MCP tool receipt
        run: npm run test:e2e

      - name: Capture server logs on failure
        if: failure()
        shell: bash
        run: |
          cat "$RUNNER_TEMP/agentation-http.log" || true
          cat "$RUNNER_TEMP/agentation-vite.log" || true

      - name: Upload browser diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: agentation-e2e-diagnostics
          path: tools/agentation/e2e/test-results/
          if-no-files-found: ignore
