name: MIDAD Factory X Registry Contract
on:
  pull_request:
    paths:
      - "mobile/factory/x/agents.registry.json"
      - "mobile/factory/x/agent-bindings.registry.json"
      - "mobile/factory/x/tests/**"
      - ".github/workflows/midad-factory-registry-tests.yml"
  push:
    branches: [main]
    paths:
      - "mobile/factory/x/agents.registry.json"
      - "mobile/factory/x/agent-bindings.registry.json"
      - "mobile/factory/x/tests/**"
      - ".github/workflows/midad-factory-registry-tests.yml"
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Validate agent and capability bindings
        run: node --test mobile/factory/x/tests/registries.test.mjs
