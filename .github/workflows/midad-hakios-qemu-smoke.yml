name: MIDAD HakiOS QEMU Smoke

on:
  push:
    branches:
      - feat/midad-compute-fabric-zero-budget
    paths:
      - 'compute/mncf/**'
      - '.github/workflows/midad-hakios-qemu-smoke.yml'
  pull_request:
    paths:
      - 'compute/mncf/**'
      - '.github/workflows/midad-hakios-qemu-smoke.yml'

permissions:
  contents: read

jobs:
  qemu-open:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout MIDAD control repository
        uses: actions/checkout@v4

      - name: Checkout pinned HakiOS source and prebuilt research artifacts
        uses: actions/checkout@v4
        with:
          repository: oosexgang/hakios-xnu-kernel
          ref: 63fc2b4633bac3af8e57dadab9f5a8d4cb940438
          path: hakios

      - name: Install QEMU and AArch64 UEFI firmware
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-arm qemu-efi-aarch64

      - name: Verify upstream prebuilt artifact integrity
        working-directory: hakios
        run: grep ' prebuilt/' prebuilt/SHA256SUMS | sha256sum -c -

      - name: Assemble Apple-free open-kernel payload
        working-directory: hakios
        shell: bash
        run: |
          ARGS="$(python3 tools/hakios-config.py args --defconfig defconfig)"
          python3 xnuloader/mkpayload.py -o qemu/payload.bin \
            kernel=prebuilt/hakios-kernel \
            ramdisk=prebuilt/userland/hello \
            --cmdline "$ARGS"

      - name: Boot HakiOS open kernel under QEMU (bounded smoke)
        working-directory: hakios
        shell: bash
        run: |
          EFI="$(find /usr/share -type f -name QEMU_EFI.fd -print -quit)"
          VARS="$(find /usr/share -type f -name QEMU_VARS.fd -print -quit)"
          if [ -z "$EFI" ]; then EFI="$(find /usr/share -type f -name AAVMF_CODE.fd -print -quit)"; fi
          if [ -z "$VARS" ]; then VARS="$(find /usr/share -type f -name AAVMF_VARS.fd -print -quit)"; fi
          test -n "$EFI" && test -n "$VARS"
          # AAVMF firmware CODE is 64 MiB while the packaged VARS template can be 2 MiB;
          # QEMU pflash devices must have matching sizes. Preserve the template and zero-extend its copy.
          VARS_PADDED="$RUNNER_TEMP/qemu-vars-$(stat -c%s "$EFI").fd"
          cp "$VARS" "$VARS_PADDED"
          truncate -s "$(stat -c%s "$EFI")" "$VARS_PADDED"
          stat -c "QEMU_EFI_BYTES=%s" "$EFI"
          stat -c "QEMU_VARS_BYTES=%s" "$VARS_PADDED"
          set +e
          QEMU_EFI="$EFI" QEMU_VARS="$VARS_PADDED" QEMU_MEM=2G bash qemu/run.sh 120 > qemu-open.log 2>&1
          status=$?
          set -e
          if [ "$status" -ne 124 ] && [ "$status" -ne 0 ]; then
            cat qemu-open.log
            exit "$status"
          fi
          cat qemu-open.log
          grep -F 'XNULOADER v3' qemu-open.log
          grep -F 'hakios-kernel: version' qemu-open.log

      - name: Upload bounded boot log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hakios-qemu-open-smoke-log
          path: hakios/qemu-open.log
          if-no-files-found: ignore
          retention-days: 7
