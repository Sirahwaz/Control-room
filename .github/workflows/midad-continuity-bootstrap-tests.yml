name: MIDAD Continuity Bootstrap Gate Tests

on:
  pull_request:
    paths:
      - "supabase/functions/_shared/midad-continuity.mjs"
      - "supabase/functions/_shared/midad-continuity.test.mjs"
      - "docs/continuity/runtime-bootstrap.json"
      - ".github/workflows/midad-continuity-bootstrap-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  continuity-bootstrap-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Run continuity bootstrap unit tests
        run: node --test supabase/functions/_shared/midad-continuity.test.mjs
