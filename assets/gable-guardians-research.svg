<!-- card 1 -->
<rect x="942" y="143" width="616" height="139" rx="18" fill="#0d1c34" stroke="#17618a" stroke-width="2"/>
<text x="964" y="175" font-family="Arial, sans-serif" font-size="19" font-weight="800" fill="#40d9ff">01  /  LIVE GAME</text>
<text x="964" y="207" font-family="Arial, sans-serif" font-size="25" font-weight="800" fill="#ffffff">Solana 2D pixel-art MMORPG</text>
<text x="964" y="238" font-family="Arial, sans-serif" font-size="16" fill="#c8d7e9">Eight combat zones, four elemental cities, quests, crafting,</text>
<text x="964" y="261" font-family="Arial, sans-serif" font-size="16" fill="#c8d7e9">PvP, guilds and NFT equipment. Web, Seeker, PSG1 and Android.</text>
<!-- card 2 -->
<rect x="942" y="300" width="616" height="146" rx="18" fill="#0d1c34" stroke="#17618a" stroke-width="2"/>
<text x="964" y="333" font-family="Arial, sans-serif" font-size="19" font-weight="800" fill="#40d9ff">02  /  DOCUMENTED $GABLE USE</text>
<text x="964" y="366" font-family="Arial, sans-serif" font-size="24" font-weight="800" fill="#ffffff">A game mechanic — not a profit promise</text>
<text x="964" y="397" font-family="Arial, sans-serif" font-size="16" fill="#c8d7e9">Mining Cave pickaxe crafting, repairs and upgrades; fragments</text>
<text x="964" y="420" font-family="Arial, sans-serif" font-size="16" fill="#c8d7e9">can be refined. Costs, eligibility and competition still apply.</text>
<!-- card 3 -->
<rect x="942" y="464" width="616" height="135" rx="18" fill="#0d1c34" stroke="#17618a" stroke-width="2"/>
<text x="964" y="496" font-family="Arial, sans-serif" font-size="19" font-weight="800" fill="#40d9ff">03  /  CURRENT EVENT</text>
<text x="964" y="529" font-family="Arial, sans-serif" font-size="24" font-weight="800" fill="#ffffff">October 2026 • dates are UTC</text>
<text x="964" y="560" font-family="Arial, sans-serif" font-size="16" fill="#c8d7e9">Docs describe an event running 1–31 October. Some drops need</text>
<text x="964" y="583" font-family="Arial, sans-serif" font-size="16" fill="#c8d7e9">paid GABLE pacts; rewards are random, with no guaranteed return.</text>
<!-- card 4 -->
<rect x="942" y="617" width="616" height="113" rx="18" fill="#0d1c34" stroke="#17618a" stroke-width="2"/>
<text x="964" y="649" font-family="Arial, sans-serif" font-size="19" font-weight="800" fill="#40d9ff">04  /  OPEN QUESTIONS</text>
<text x="964" y="681" font-family="Arial, sans-serif" font-size="22" font-weight="800" fill="#ffffff">Supply and emissions remain unclear</text>
<text x="964" y="708" font-family="Arial, sans-serif" font-size="16" fill="#c8d7e9">Reviewed pages did not establish a complete token schedule.</text>
<!-- card 5 -->
<rect x="942" y="748" width="616" height="92" rx="18" fill="#0d1c34" stroke="#a8792e" stroke-width="2"/>
<text x="964" y="780" font-family="Arial, sans-serif" font-size="19" font-weight="800" fill="#ffd16a">05  /  MYCELIUM CONTEXT</text>
<text x="964" y="809" font-family="Arial, sans-serif" font-size="15" fill="#e7edf6">Allocation was not independently confirmed on the visible public page.</text>
<text x="964" y="829" font-family="Arial, sans-serif" font-size="15" fill="#e7edf6">Do not infer a partnership or portfolio position.</text>
<text x="943" y="873" font-family="Arial, sans-serif" font-size="13" fill="#95a9c5">Sources: gableguardians.xyz/docs.html • Solscan • Mycelium allocations</text>
