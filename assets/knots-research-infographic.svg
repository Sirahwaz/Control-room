<title id="title">KNOTS holder-reward mechanism — independent research infographic</title>
<desc id="desc">A concise map of the reward system described by the KNOTS official website: 3 percent transfer tax, distribution and operations fee disclosed as approximately 2.5 percent, pro-rata rewards paid in STONK, and a 20 dollar equivalent KNOTS holding threshold at payout time. A caution notes this does not establish net yield.</desc>
