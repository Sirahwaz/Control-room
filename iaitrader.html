function activity(){const p=S.data?.paper_trades||[],l=S.data?.decision_ledger||[];return '<div class="page"><section class="section-title"><span class="eyebrow">PAPER LAB / DECISION LEDGER</span><h1>'+t("activity")+'</h1><p>Evidence → Decision → Outcome → Learning.</p></section><section class="grid2"><article class="panel"><div class="head"><div><span class="eyebrow">PAPER</span><h3>'+t("paper")+'</h3></div></div><div class="venue-table">'+p.slice(0,14).map(x=>'<div class="venue"><b>'+esc(x.asset_symbol||"BTC")+'</b><span>'+esc(x.direction||"NEUTRAL")+'</span><strong>'+pct(x.confidence)+'</strong><span>'+esc(x.status||"—")+'</span>'+badge(x.gate_decision||"review")+'</div>').join("")||'<div class="empty">لا توجد Paper candidates.</div>'+'</div></article><article class="panel"><div class="head"><div><span class="eyebrow">LEDGER</span><h3>Evidence → Decision</h3></div></div><div class="venue-table">'+l.slice(0,14).map(x=>'<div class="venue"><b>'+esc(x.subject_key||"BTCUSDT")+'</b><span>'+esc(x.decision||"WAIT")+'</span><strong>'+esc(x.reason_code||"—")+'</strong><span>'+esc(x.outcome_status||"pending")+'</span><small>'+esc(x.created_at||"")+'</small></div>').join("")||'<div class="empty">لا توجد قرارات.</div>'+'</div></article></section><section class="panel"><span class="eyebrow">MYSUN TRACE</span><div class="loop-map"><span>FACT</span> → <span>INFERRED</span> → <span>RISK</span> → <span>BLOCKED/APPROVED</span> → <span>LEARN</span></div></section></div>'}
function settings(){const g=S.data?.governor||{},con=S.data?.connectors||[],p=g.metadata?.profit_policy||{};return '<div class="page"><section class="section-title"><span class="eyebrow">SYSTEM / LANGUAGE / EXCHANGE / SAFETY</span><h1>'+t("settings")+'</h1><p>'+esc(t("secrets"))+'</p></section><section class="settings-grid"><article class="panel"><div class="head"><div><span class="eyebrow">LANGUAGE</span><h3>'+t("language")+'</h3></div></div><div class="lang-grid"><button data-lang="ar">العربية</button><button data-lang="fa">فارسی</button><button data-lang="en">English</button></div><div class="native"><div><b>Telegram</b>'+badge("VERIFIED")+'</div><div><b>CloudStorage</b>'+badge(TG()?.CloudStorage?"AVAILABLE":"LOCAL")+'</div><div><b>Haptics</b>'+badge(TG()?.HapticFeedback?"AVAILABLE":"GUARDED")+'</div><div><b>Biometric</b>'+badge(TG()?.BiometricManager?"AVAILABLE":"GUARDED")+'</div></div><button class="btn wide" data-cmd="fullscreen">↗ Fullscreen</button></article><article class="panel"><div class="head"><div><span class="eyebrow">TRADING CONFIG</span><h3>'+t("capital")+'</h3></div>'+badge(g.kill_switch?"LOCKED":"GATED")+'</div><div class="form"><label>'+t("venue")+'<select id="cfgVenue"><option value="weex">WEEX</option><option value="coinex">CoinEx</option></select></label><label>'+t("asset")+'<select id="cfgAsset"><option>BTC</option><option>ETH</option></select></label><label>'+t("mode")+'<select id="cfgMode"><option value="paper">Paper</option><option value="shadow">Shadow</option><option value="micro_live">Micro-Live (gated)</option></select></label><label>'+t("capital")+' $<input id="cfgCapital" type="number" min="1" max="10" step=".5" value="'+esc(g.metadata?.starting_capital_usd||1)+'"></label><label>Max Trade $<input id="cfgTrade" type="number" min=".1" max="10" step=".1" value="'+esc(g.max_order_usd||1)+'"></label><label>Max Position $<input id="cfgPosition" type="number" min=".1" max="10" step=".1" value="'+esc(g.max_position_usd||1)+'"></label><label>Daily Loss $<input id="cfgLoss" type="number" min=".01" max="1" step=".01" value="'+esc(g.max_daily_loss_usd||.1)+'"></label><label>Trades/day<input id="cfgTrades" type="number" min="1" max="10" value="'+esc(g.max_daily_trades||3)+'"></label><label>Confidence<input id="cfgConf" type="number" min=".5" max=".99" step=".01" value="'+esc(g.min_signal_confidence||.85)+'"></label><label>Net Edge %<input id="cfgEdge" type="number" min="0" step=".05" value="'+esc(g.min_expected_net_edge_pct||.2)+'"></label><label>'+t("principal")+' $<input id="cfgPrincipal" type="number" min=".1" max="10" step=".1" value="'+esc(g.principal_floor_usd||1)+'"></label><label>Cycle / min<input id="cfgCycle" type="number" min="1" max="60" value="'+esc(g.metadata?.automation?.cycle_minutes||5)+'"></label></div><div class="range-row"><label>'+t("reserve")+' %<input id="cfgReserve" type="number" min="0" max="100" value="'+esc(p.reserve_pct??100)+'"></label><label>'+t("reinvest")+' %<input id="cfgReinvest" type="number" min="0" max="100" value="'+esc(p.reinvest_pct??0)+'"></label></div><select id="cfgProfit" class="wide-select"><option value="isolate100">'+t("isolated")+'</option><option value="split5050">'+t("split")+'</option><option value="reinvest100">'+t("reinvest100")+'</option><option value="custom">Custom</option></select><button class="btn primary wide" data-cmd="saveCfg">✓ '+t("save")+'</button></article></section><section class="panel"><div class="head"><div><span class="eyebrow">EXCHANGE CONNECTOR</span><h3>'+t("connect")+'</h3></div></div><div class="form"><label>'+t("venue")+'<select id="credVenue"><option value="weex">WEEX</option><option value="coinex">CoinEx</option></select></label><label>Account Label<input id="credLabel" autocomplete="off" placeholder="My trading account"></label><label class="weex-field">'+t("apiKey")+'<input id="credKey" autocomplete="off"></label><label class="weex-field">'+t("apiSecret")+'<input id="credSecret" type="password" autocomplete="off"></label><label class="weex-field">'+t("passphrase")+'<input id="credPass" type="password" autocomplete="off"></label><label class="coinex-field hidden">Access ID<input id="credAccess" autocomplete="off"></label><label class="coinex-field hidden">Secret Key<input id="credCoinSecret" type="password" autocomplete="off"></label></div><div class="gatebar"><span>'+t("tradeOnly")+'</span><span>'+t("withdraw")+'</span><span>Vault</span><span>NO secret echo</span></div><button class="btn primary wide" data-cmd="saveCred">🔐 '+t("connect")+'</button><div class="security-note">'+esc(t("secrets"))+'</div></section><section class="grid2">'+con.filter(x=>["weex","coinex"].includes(x.provider)).map(x=>'<article class="panel"><div class="head"><h3>'+esc(x.provider.toUpperCase())+'</h3>'+badge(x.status||"planned")+'</div><p>spot_trade ✓ · market_read ✓ · withdrawals ✕</p><button class="line-btn" data-cmd="test" data-p="'+esc(x.provider)+'">'+t("test")+'</button></article>').join("")+'</section><section class="panel"><div class="head"><div><span class="eyebrow">MICRO-LIVE GATE</span><h3>'+t("secure")+'</h3></div>'+badge("LOCKED")+'</div><p class="note">'+esc(t("micro"))+'</p><button class="btn" data-cmd="live">🔐 '+t("live")+'</button></section></div>'}
function languageModal(){document.body.insertAdjacentHTML("beforeend",'<div id="lm" class="modal"><section class="panel modal-card"><div class="head"><h3>'+t("language")+'</h3><button class="mini-btn" data-cmd="close">×</button></div><div class="lang-grid"><button data-lang="ar">العربية</button><button data-lang="fa">فارسی</button><button data-lang="en">English</button></div></section></div>')}
window.addEventListener("error",e=>{const a=document.querySelector("#app");if(a&&!a.querySelector(".fatal-error"))a.insertAdjacentHTML("afterbegin",'<section class="session fatal-error"><div class="gate">!</div><h2>iAiTrader runtime error</h2><p>'+esc(e.message||"Unknown UI error")+"</p><p>Reload from @iAiTrader_bot.</p></section>")});
function render(){document.documentElement.lang=S.lang;document.documentElement.dir=S.lang==="en"?"ltr":"rtl";let body;if(!TG()?.initData){body='<section class="session"><div class="gate">₿</div><span class="eyebrow">SECURE TELEGRAM MINI APP</span><h2>'+t("noSession")+'</h2><p>'+esc(t("sessionText"))+'</p><a class="btn primary" href="https://t.me/iAiTrader_bot" target="_blank" rel="noopener">↗ @iAiTrader_bot</a></section>'}else{body=S.v==="markets"?markets():S.v==="trade"?trade():S.v==="portfolio"?portfolio():S.v==="strategy"?strategy():S.v==="automation"?automation():S.v==="activity"?activity():S.v==="settings"?settings():cockpit()}one("#app").innerHTML=top()+'<main>'+body+'</main>'+(TG()?.initData?'<nav class="bottom">'+nav("cockpit","◉")+nav("markets","⌁")+nav("trade","↯")+nav("portfolio","◈")+nav("settings","⚙")+'</nav>':"");bind();native()}
function bind(){all("[data-v]").forEach(e=>e.onclick=async()=>{S.v=e.dataset.v;await csSet("view",S.v);render()});all("[data-lang]").forEach(e=>e.onclick=async()=>{S.lang=e.dataset.lang;await csSet("lang",S.lang);one("#lm")?.remove();render()});all("[data-cmd]").forEach(e=>e.onclick=async()=>{const c=e.dataset.cmd;if(c==="refresh")load();else if(c==="analyze")run("analyze");else if(c==="paper")run("paper");else if(c==="lock")run("lock");else if(c==="live")run("live");else if(c==="language")languageModal();else if(c==="close")one("#lm")?.remove();else if(c==="settings"){S.v="settings";render()}else if(c==="saveCfg")saveCfg();else if(c==="saveCred")saveCred();else if(c==="test")test(e.dataset.p);else if(c==="prepare")prepare();else if(c==="rules"){rules()}else if(c==="fullscreen"){try{TG()?.requestFullscreen?.()}catch{}}});const cv=one("#credVenue");if(cv)cv.onchange=()=>{all(".weex-field").forEach(x=>x.classList.toggle("hidden",cv.value!=="weex"));all(".coinex-field").forEach(x=>x.classList.toggle("hidden",cv.value==="weex"))}}
async function rules(){try{const j=await api("market_rules",{provider:one("#tradeVenue")?.value||"weex",market:one("#tradeMarket")?.value||"BTCUSDT"});one("#rulesOut").textContent=JSON.stringify(j.rules||j,null,2)}catch(e){one("#rulesOut").textContent=String(e.message||e)}}
function native(){const tg=TG();if(!tg)return;try{tg.ready();tg.expand();tg.setHeaderColor?.("#040710");tg.SettingsButton?.show?.();tg.SettingsButton?.onClick?.(()=>{S.v="settings";render()});if(S.v==="cockpit")tg.BackButton?.hide?.();else{tg.BackButton?.show?.();tg.BackButton?.onClick?.(()=>{S.v="cockpit";render()})}tg.MainButton?.setParams?.({text:S.busy?"RUNNING":t("analyze"),is_visible:true,is_active:!S.busy});tg.MainButton?.offClick?.(mc);tg.MainButton?.onClick?.(mc);tg.SecondaryButton?.setParams?.({text:t("refresh"),is_visible:true,is_active:!S.busy});tg.SecondaryButton?.offClick?.(sc);tg.SecondaryButton?.onClick?.(sc);tg.BiometricManager?.init?.(()=>{})}catch{}}
function mc(){run(S.v==="trade"?"paper":"analyze")}function sc(){load()}
async function boot(){const l=await csGet("lang"),v=await csGet("view");S.lang=l&&T[l]?l:((TG()?.initDataUnsafe?.user?.language_code||"ar").toLowerCase().startsWith("fa")?"fa":(TG()?.initDataUnsafe?.user?.language_code||"").toLowerCase().startsWith("en")?"en":"ar");if(v&&["cockpit","markets","trade","portfolio","strategy","automation","activity","settings"].includes(v))S.v=v;render();if(TG()?.initData)load()}
boot();
let tgAttempts=0;
function hydrateTelegram(){
  const tg=TG();
  if(tg?.initData){render();if(!S.data&&!S.busy)load();return;}
  if(tgAttempts++<30){setTimeout(hydrateTelegram,100);return;}
  render();
}
window.addEventListener("load",()=>setTimeout(hydrateTelegram,50));
})();</script></body></html>
