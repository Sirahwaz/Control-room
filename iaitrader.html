function xrayModel(){
 const m=S.result?.features||S.result?.signal||S.data?.signals?.[0]?.payload||{},src=S.result?.evidence?.market_sources||[],raw=(S.data?.signals||[]).slice(0,30).reverse().map(x=>Number(x.payload?.price)).filter(Number.isFinite);
 const mid=Number(m.price)||Number(raw[raw.length-1])||100,conf=Math.max(0,Math.min(1,Number(m.confidence)||0)),spread=Number(m.max_spread_pct)||0,change=Number(m.avg_change_24h_pct??m.change_24h_pct)||0,sources=Number(m.usable_sources??src.length)||0;
 return {m,src,raw,mid,conf,spread,change,sources};
}
function orderBookXray(){
 const x=xrayModel(),step=Math.max(x.mid*.00035,x.spread?x.mid*x.spread/100:Math.max(x.mid*.00025,.01)),bias=Math.max(-1,Math.min(1,x.change/4));
 const rows=(side)=>[1,2,3,4,5,6].map((n)=>{const delta=step*n*(side==="bid"?-.99:1.01),px=x.mid+delta,pressure=Math.max(18,Math.min(98,54+(side==="bid"?-bias: bias)*18+(6-n)*4+x.sources*2));return '<div class="depth-row"><span>'+px.toFixed(px>=100?2:4)+'</span><span class="bar"><i style="width:'+pressure.toFixed(0)+'%"></i></span><b>'+pressure.toFixed(0)+'%</b></div>';}).join("");
 return '<article class="xray-card"><div class="xray-top"><div><span class="eyebrow">ORDER BOOK X-RAY</span><h3>Bid / Ask Pressure</h3></div>'+badge(x.sources?"DERIVED":"WAIT","cyan")+'</div><div class="depth-wrap"><div class="depth-col bid"><h4>● BIDS</h4>'+rows("bid")+'</div><div class="depth-col ask"><h4>● ASKS</h4>'+rows("ask")+'</div></div><div class="depth-foot"><span>MID '+x.mid.toFixed(x.mid>=100?2:4)+'</span><span>Δ '+(x.spread?x.spread.toFixed(4):"—")+'%</span></div><div class="xray-note">Normalized liquidity proxy from the available multi-venue signal surface. Exchange-native depth is not claimed unless a venue depth feed is attached.</div></article>';
}
function liquidityHeatmapXray(){
 const x=xrayModel(),seed=Math.max(.06,Math.min(.94,.22+x.conf*.5+x.sources*.035-Math.abs(x.change)*.03));
 let cells="";
 for(let i=0;i<40;i++){const wave=Math.abs(Math.sin(i*1.73+x.change*.8)),v=Math.max(.05,Math.min(.9,seed*(.45+.9*wave)));cells+='<i style="--v:'+v.toFixed(2)+'"></i>';}
 return '<article class="xray-card"><div class="xray-top"><div><span class="eyebrow">LIQUIDITY HEATMAP</span><h3>Pressure Field</h3></div><span class="xray-chip">MODEL</span></div><p>High-energy zones indicate where the current signal model expects price-pressure concentration.</p><div class="heatmap">'+cells+'</div><div class="heat-legend"><span>LOW</span><span>CONCENTRATED</span><span>HIGH</span></div></article>';
}
function spreadRadarXray(){
 const x=xrayModel(),score=Math.max(4,Math.min(96,78-x.spread*18+x.conf*15+x.sources*2)),label=score>75?"TIGHT":score>48?"BALANCED":"WIDE";
 return '<article class="xray-card"><div class="xray-top"><div><span class="eyebrow">ANIMATED SPREAD RADAR</span><h3>Execution Friction</h3></div>'+badge(label,score>75?"good":score>48?"warn":"bad")+'</div><div class="radar-box"><div class="radar"><div class="radar-sweep"></div><div class="radar-dot"></div><div class="radar-mid"></div><span class="radar-label a">ASK</span><span class="radar-label b">BID</span><span class="radar-label c">MID</span></div></div><div class="spread-grid"><div class="spread-stat"><span>MAX SPREAD</span><b>'+(x.spread?x.spread.toFixed(4):"—")+'%</b></div><div class="spread-stat"><span>RADAR SCORE</span><b>'+score.toFixed(0)+'</b></div></div></article>';
}
function mtfXray(){
 const x=xrayModel(),src=x.raw.length>5?x.raw:[100,99.7,100.2,100.1,100.8,100.4,101.1,100.9,101.6,101.4,101.8,101.5,102.1,101.9];
 const tf=[["5m",src.slice(-9)],["15m",src.slice(0,9)],["1h",src.filter((_,i)=>i%2===0).slice(-9)]];
 const box=tf.map(([name,a])=>{const lo=Math.min(...a),hi=Math.max(...a),r=Math.max(hi-lo,.0001),last=a[a.length-1];return '<div class="mtf-box"><div class="mtf-head"><b>'+name+'</b><span>'+((last-a[0])/a[0]*100).toFixed(2)+'%</span></div><div class="mtf-bars">'+a.slice(-9).map((v,i)=>{const prev=i?a[i-1]:a[0],h=16+((v-lo)/r)*64;return '<i class="'+(v>=prev?"":"down")+'" style="height:'+h.toFixed(0)+'px"></i>';}).join("")+'</div></div>';}).join("");
 return '<article class="xray-card"><div class="xray-top"><div><span class="eyebrow">MULTI-TIMEFRAME</span><h3>Sequence Candles</h3></div><span class="xray-chip">'+(x.raw.length?"SIGNAL FEED":"PREVIEW")+'</span></div><div class="mtf-grid">'+box+'</div><div class="xray-note">Timeframe buckets are derived from the available signal sequence; they are not exchange-native OHLC intervals.</div></article>';
}

function copilotCandidates(){
 const rows=[],seen=new Set();
 for(const s of (S.data?.signals||[])){
  const p=s?.payload||{},sym=String(p.symbol||p.asset_symbol||s?.entity||"").toUpperCase().replace(/[\/-]/g,"");
  if(!sym||seen.has(sym))continue;
  const price=Number(p.price),conf=Math.max(0,Math.min(1,Number(p.confidence??s.confidence)||0));
  if(Number.isFinite(price)||conf>0){seen.add(sym);rows.push({symbol:sym.includes("USDT")?sym:sym+"USDT",price:Number.isFinite(price)?price:null,confidence:conf,score:Number(s.score)||0,direction:String(p.direction||s.signal_type||"NEUTRAL")});}
 }
 for(const p of (S.data?.paper_trades||[])){
  const sym=String(p.asset_symbol||"").toUpperCase().replace(/[\/-]/g,"");
  if(!sym||seen.has(sym))continue;
  seen.add(sym);rows.push({symbol:sym,price:Number(p.entry_price)||null,confidence:Math.max(0,Math.min(1,Number(p.confidence)||0)),score:Number(p.outcome_return_pct)||0,direction:String(p.direction||"NEUTRAL")});
 }
 return rows.slice(0,12);
}
function copilotBestCandidate(ctx){
 const spread=ctx.spread==null?0:Math.max(0,Math.min(1,1-Number(ctx.spread)/2));
 const src=Math.max(0,Math.min(1,(Number(ctx.sources)||0)/5));
 const move=Math.max(0,Math.min(1,Math.abs(Number(ctx.change)||0)/3));
 return copilotCandidates().map(x=>{
  const evidence=(x.confidence*.48)+(src*.20)+(spread*.20)+(move*.07)+(Math.max(0,Math.min(1,(x.score+1)/2))*.05);
  return {...x,evidence};
 }).sort((a,b)=>b.evidence-a.evidence)[0]||null;
}

 return {...base,bestCandidate:copilotBestCandidate(base)};

function copilotInferMode(question,current="explain"){

 if(/(اختار|أفضل|افضل|أي عملة|اي عملة|مرشح|عملة|coin|best|which)/.test(q))return"choose";
 if(/(إشارة|اشارة|اتجاه|توقع|صعود|هبوط|signal|direction|forecast)/.test(q))return"signal";
 if(/(خطر|مخاطر|مخاطرة|سبريد|مصدر|مصادر|risk|spread|source)/.test(q))return"scan";
 if(/(نفذ|تنفيذ|شراء|بيع|صفقة|order|buy|sell|execute|trade)/.test(q))return"act";

function copilotHumanState(ctx){

  action="الأفضل الآن الانتظار إلى أن يظهر كسر أو تأكيد أقوى بدل مطاردة الحركة داخل النطاق.";
 }else if(dir==="NEUTRAL"&&conf<=0.05){
  direct="الإشارة محايدة، وثقة المحرك شبه معدومة؛ لذلك القرار الصحيح الآن هو عدم اختلاق اتجاه.";
  meaning="الصفر هنا يعني أن المحرك ما عنده أدلة كافية، مو أن السوق احتمال صعوده أو هبوطه حرفيًا صفر.";
  action="نحتاج evidence أقوى أو جولة تحليل جديدة قبل أي اتجاه.";
 }else if(dir==="NEUTRAL"){
  direct="الصورة الحالية محايدة: ما عندنا edge اتجاهي واضح يستحق BUY أو SELL.";
  meaning="السوق ممكن يتحرك، لكن الأدلة الحالية ما تبرر أن نقول لك إن هناك اتجاهًا موثوقًا.";
  action=conf<0.35?"خلّينا ننتظر confirmation أقوى قبل أي خطوة.":"نراقب ونختبر الفرضية في Paper بدل المخاطرة بالمال.";
 }else{
  direct="عندنا ميل "+(dir==="BUY"?"للشراء":"للبيع")+" في البيانات الحالية، لكنه ما يزال رأيًا تحليليًا وليس أمر تنفيذ.";
  meaning="الاتجاه موجود لأن الأدلة تميل له، لكن قوة هذا الميل تعتمد على الثقة والمصادر وتكلفة التنفيذ.";
  action=conf>=0.7?"نحوّل الفكرة إلى Paper Intent ونراقب النتيجة بدل التنفيذ الحي.":"نحتاج تأكيدًا إضافيًا قبل رفعها من مجرد إشارة إلى قرار.";
 }

 return {direct,meaning,action,missing:missing.join(" · ")||"ماكو blocker واضح ضمن البيانات الحالية"};
}

 document.body.insertAdjacentHTML("beforeend",'<div id="copilotDrawer" class="copilot-drawer"><section class="copilot-sheet"><div class="copilot-head"><div class="copilot-id"><div class="copilot-core">🧠</div><div><h3>'+t("copilot")+'</h3><p>قل لي سؤالك بطريقتك الطبيعية؛ أحوّل حالة النظام إلى معنى بشري وخطوة واضحة.</p></div></div><button class="copilot-close" data-cmd="copilot-close">×</button></div><div class="copilot-modes">'+modes.map(x=>'<button class="copilot-mode" data-copilot-mode="'+x[0]+'">'+x[1]+' '+t(x[2])+'</button>').join("")+'</div><div class="copilot-context"><div><span>ASSET</span><b>BTC/USDT</b></div><div><span>الحالة</span><b>'+esc(ctx.direction)+'</b></div><div><span>الثقة</span><b>'+((ctx.confidence||0)*100).toFixed(1)+'%</b></div><div><span>السياق</span><b>'+esc(ctx.regime)+'</b></div><div><span>السبريد</span><b>'+((ctx.spread==null)?"غير مقاس":Number(ctx.spread).toFixed(4)+"%")+'</b></div><div><span>المصادر</span><b>'+esc(ctx.sources)+'</b></div><div><span>VENUES</span><b>'+esc(ctx.connected.join(",")||"—")+'</b></div><div><span>LIVE</span><b>LOCKED</b></div></div><div id="copilotLog" class="copilot-log"></div><div id="copilotDecision" class="copilot-decision"></div><div class="copilot-quick"><button data-copilot-quick="explain">شنو يعني الوضع الحالي؟</button><button data-copilot-quick="choose">شنو أفضل مرشح؟</button><button data-copilot-quick="scan">وين الخطر أو النقص؟</button><button data-copilot-quick="act">جهّز Paper فقط</button></div><div class="copilot-compose"><button class="copilot-icon" data-cmd="copilot-mic" aria-label="Voice">🎙</button><textarea id="copilotInput" placeholder="'+t("ask")+'"></textarea><button class="copilot-send" data-cmd="copilot-send">➤</button></div><div class="copilot-footer"><button data-cmd="copilot-clear">↺ '+t("clear")+'</button><button data-cmd="copilot-act">⚙ '+t("paperIntent")+'</button></div></section></div>');
 bind();setCopilotMode(copilotMode());copilotRenderDecision(ctx);await copilotRestore();
 if(!(S.copilot?.messages?.length)){
  copilotAppend("ai","أشوف الصورة الحالية، وأشرحها لك بلغة بشرية: شنو نعرف، شنو يعني، شنو أفضل خطوة، وشنو الناقص — بدون ما أخترع معلومة.");
 }
}
async function copilotAsk(q,forcedMode=null){
 const input=one("#copilotInput"),question=String(q??input?.value??"").trim();if(!question)return;
 if(input&&input.value.trim()===question)input.value="";
 copilotAppend("user",question);
 const ctx=copilotContext(),mode=forcedMode||copilotInferMode(question,copilotMode());
 setCopilotMode(mode);
 copilotAppend("ai","أركّب الصورة…");
 const log=one("#copilotLog");if(log&&log.lastElementChild)log.lastElementChild.remove();
 try{
   const j=await api("copilot",{mode,language:S.lang,task_class:"market_analysis",prompt:question,context:ctx,messages:(S.copilot?.messages||[]).filter(x=>x.content!=="أركّب الصورة…").slice(-10).map(x=>({role:x.role,content:String(x.content||"").slice(0,5000)}))},45000);
   if(j?.answer){
    const fresh=copilotContext();
    copilotAppend("ai",j.answer);copilotRenderDecision(fresh);return;
   }
   throw new Error(j?.error||"copilot_empty");
 }catch{
   try{
    const a=await api("analyze",{},90000);S.result=a.result||a;const fresh=copilotContext();
    copilotAppend("ai",localCopilotReason(mode,question,fresh));copilotRenderDecision(fresh);
   }catch(e){
    copilotAppend("ai",localCopilotReason(mode,question,ctx));copilotRenderDecision(ctx);
   }
 }
}
async function copilotPaper(){
 const ctx=copilotContext();if(!ctx.price){copilotAppend("ai","لا يوجد سعر مؤكد؛ Paper Intent متوقف حتى تتوفر الأدلة.");return;}
 try{
  const j=await api("prepare",{provider:(ctx.connected[0]||"weex"),market:"BTCUSDT",side:ctx.direction==="BUY"?"buy":ctx.direction==="SELL"?"sell":"watch",amount:Math.min(1,Number(ctx.capital)||1)},45000);
  copilotAppend("ai",j?.result?"✅ "+t("paperIntent")+" جاهز. تم إعداد Intent فقط؛ لم يتم إرسال أمر حي.":"⚠️ لم يكتمل إعداد Paper Intent.");
 }catch(e){copilotAppend("ai","🔒 Paper Intent محجوب: "+String(e.message||e));}
}
function copilotVoice(){
 const R=window.SpeechRecognition||window.webkitSpeechRecognition;if(!R){copilotAppend("ai","الصوت غير مدعوم في هذا المتصفح.");return}
 try{const r=new R();r.lang=S.lang==="fa"?"fa-IR":S.lang==="en"?"en-US":"ar-IQ";r.interimResults=false;r.maxAlternatives=1;r.onresult=e=>{const t0=e.results?.[0]?.[0]?.transcript||"";if(one("#copilotInput"))one("#copilotInput").value=t0};r.onerror=()=>copilotAppend("ai","لم ألتقط الصوت. حاول مرة أخرى.");r.start()}catch{copilotAppend("ai","تعذر بدء الإدخال الصوتي.");}
}
function copilotQuick(mode){
 const q={explain:"لماذا هذه الإشارة؟",choose:"ما أفضل مرشح الآن؟",signal:"أعطني الإشارة الحالية مع سببها.",scan:"افحص المخاطر والسبريد والمصادر.",act:"جهّز Paper Intent فقط، ولا تنفذ حيًا."}[mode]||"حلّل الوضع الحالي.";
 setCopilotMode(mode);copilotAsk(q,mode);
}

}

function languageModal(){one("#lm")?.remove();document.body.insertAdjacentHTML("beforeend",'<div id="lm" class="modal"><section class="panel modal-card"><div class="head"><h3>'+t("language")+'</h3><button class="mini-btn" data-cmd="close">×</button></div><div class="lang-grid"><button data-lang="ar">العربية</button><button data-lang="fa">فارسی</button><button data-lang="en">English</button></div></section></div>');bind()}

function applyUiPrefs(p={}){document.documentElement.dataset.font=p.font||document.documentElement.dataset.font||"comfortable";document.documentElement.dataset.density=p.density||document.documentElement.dataset.density||"balanced";document.documentElement.dataset.theme=p.theme||document.documentElement.dataset.theme||"neural";document.documentElement.dataset.motion=p.motion||document.documentElement.dataset.motion||"fluid"}
async function saveUiPref(k,v){const p={font:document.documentElement.dataset.font||"comfortable",density:document.documentElement.dataset.density||"balanced",theme:document.documentElement.dataset.theme||"neural",motion:document.documentElement.dataset.motion||"fluid"};p[k]=v;applyUiPrefs(p);await csSet("ui_"+k,v);render()}
function render(){document.documentElement.lang=S.lang;document.documentElement.dir=S.lang==="en"?"ltr":"rtl";let body;if(!TG()?.initData){body='<section class="session"><div class="gate">₿</div><span class="eyebrow">SECURE TELEGRAM MINI APP</span><h2>'+t("noSession")+'</h2><p>'+esc(t("sessionText"))+'</p><a class="btn primary" href="https://t.me/iAiTrader_bot" target="_blank" rel="noopener">↗ @iAiTrader_bot</a></section>'}else{body=S.v==="markets"?markets():S.v==="trade"?trade():S.v==="portfolio"?portfolio():S.v==="strategy"?strategy():S.v==="automation"?automation():S.v==="activity"?activity():S.v==="settings"?settings():cockpit()}one("#app").innerHTML=top()+'<main>'+body+'</main>'+injectCopilot()+(TG()?.initData?'<nav class="bottom">'+nav("cockpit","◉")+nav("markets","⌁")+nav("trade","↯")+nav("portfolio","◈")+'<button class="'+(S.v==="more"?"active":"")+'" data-cmd="more">⋯<small>'+t("more")+'</small></button>'+'</nav>':"");bind();native()}
function bind(){all("[data-v]").forEach(e=>e.onclick=async()=>{S.v=e.dataset.v;one("#moreModal")?.remove();await csSet("view",S.v);render()});all("[data-lang]").forEach(e=>e.onclick=async()=>{S.lang=e.dataset.lang;await csSet("lang",S.lang);one("#lm")?.remove();one("#moreModal")?.remove();render()});all("[data-pref]").forEach(e=>e.onclick=()=>saveUiPref(e.dataset.pref,e.dataset.prefValue));all("[data-cmd]").forEach(e=>e.onclick=async()=>{const c=e.dataset.cmd;if(c==="refresh")load();else if(c==="analyze")run("analyze");else if(c==="paper")run("paper");else if(c==="lock")run("lock");else if(c==="live")run("live");else if(c==="language")languageModal();else if(c==="close")one("#lm")?.remove();else if(c==="settings"||c==="appearance"){S.v="settings";render()}else if(c==="closeAdapter"){one("#adapterModal")?.remove()}else if(c==="adapter"){openAdapterModal()}else if(c==="more"){moreModal()}else if(c==="closeMore"){one("#moreModal")?.remove()}else if(c==="copilot"){openCopilot()}else if(c==="copilot-close"){one("#copilotDrawer")?.remove()}else if(c==="copilot-send"){copilotAsk()}else if(c==="copilot-mic"){copilotVoice()}else if(c==="copilot-clear"){const l=one("#copilotLog");if(l)l.innerHTML="";if(S.copilot)S.copilot.messages=[];csSet("copilot_memory","")}else if(c==="copilot-act"){copilotPaper()}else if(c==="saveCfg")saveCfg();else if(c==="saveCred")saveCred();else if(c==="test")test(e.dataset.p);else if(c==="prepare")prepare();else if(c==="rules"){rules()}else if(c==="fullscreen"){try{TG()?.requestFullscreen?.()}catch{}}});const cv=one("#credVenue");const sync=()=>{const v=cv?.value||"weex";all(".weex-field").forEach(x=>x.classList.toggle("hidden",v!=="weex"));all(".coinex-field").forEach(x=>x.classList.toggle("hidden",v!=="coinex"));all(".api-weex").forEach(x=>x.classList.toggle("hidden",v!=="weex"));all(".api-ourbit").forEach(x=>x.classList.toggle("hidden",v!=="ourbit"))};all("[data-copilot-mode]").forEach(e=>e.onclick=()=>setCopilotMode(e.dataset.copilotMode));all(" async function boot(){const cp=await csGet("copilot_mode");if(cp)document.documentElement.dataset.copilotMode=cp;const cm=await csGet("copilot_memory");if(cm)try{S.copilot.messages=JSON.parse(cm)||[]}catch{};const l=await csGet("lang"),v=await csGet("view"),pf={font:await csGet("ui_font"),density:await csGet("ui_density"),theme:await csGet("ui_theme"),motion:await csGet("ui_motion")};applyUiPrefs(pf);S.lang=l&&T[l]?l:((TG()?.initDataUnsafe?.user?.language_code||"ar").toLowerCase().startsWith("fa")?"fa":(TG()?.initDataUnsafe?.user?.language_code||"").toLowerCase().startsWith("en")?"en":"ar");if(v&&["cockpit","markets","trade","portfolio","strategy","automation","activity","settings"].includes(v))S.v=v;render();if(TG()?.initData)load()}
boot();
let tgAttempts=0;

  const tg=TG();
  if(tg?.initData){render();if(!S.data&&!S.busy)load();return;}
