<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050812">
<meta name="description" content="MIDAD — Explainable Control Surface">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./midad-pwa-icon.svg">
<title>MIDAD — Control Room v16</title>
<link rel="stylesheet" href="./midad-control-v16.css?v=20260926a">
<script src="https://telegram.org/js/telegram-web-app.js?63"></script>
</head>
<body>
<div id="midadBootGuard" style="display:none;position:fixed;inset:0;z-index:99999;padding:28px;background:#050812;color:#eef6ff;font-family:system-ui,sans-serif">
  <div style="max-width:760px;margin:10vh auto;border:1px solid #263750;border-radius:20px;padding:24px;background:#091321;box-shadow:0 24px 70px rgba(0,0,0,.4)">
    <div style="font-size:11px;letter-spacing:.14em;color:#63e8ff;font-weight:900">MIDAD // BOOT DIAGNOSTIC</div>
    <h2 style="margin:10px 0">تعذر تشغيل طبقة Control Surface</h2>
    <p id="midadBootError" style="line-height:1.8;color:#a9bacd">حدث خطأ أثناء الإقلاع.</p>
    <button onclick="location.reload()" style="margin-top:12px;padding:10px 14px;border-radius:10px;border:1px solid #263750;background:#101c2d;color:#eef6ff">إعادة المحاولة</button>
    <button onclick="window.MIDAD_LOAD_LEGACY&&window.MIDAD_LOAD_LEGACY()" style="margin-top:12px;margin-inline-start:8px;padding:10px 14px;border-radius:10px;border:1px solid #63e8ff;background:#0d2230;color:#eef6ff">فتح الواجهة الاحتياطية</button>
  </div>
</div>
<div id="m16Root" class="m16-app" aria-live="polite"></div>
<noscript><div style="padding:30px;color:#fff;background:#05070c">MIDAD Control Room يحتاج JavaScript للعمل.</div></noscript>
<script>
window.MIDAD_LOAD_LEGACY=function(){
  document.getElementById("midadBootGuard").style.display="none";
  if(!document.getElementById("midadLegacyCss")){
    ["styles-max.css","midad-maximum-enhancements.css","midad-command-v2.css"].forEach(function(p,i){
      var l=document.createElement("link");l.id="midadLegacyCss"+i;l.rel="stylesheet";l.href="./"+p+"?legacy=20260926";document.head.appendChild(l);
    });
  }
  var s=document.createElement("script");s.src="./app-max.js?v=v16-legacy-fallback";document.body.appendChild(s);
};
window.addEventListener("error",function(e){
  if(window.__MIDAD_V16_READY)return;
  var b=document.getElementById("midadBootGuard"),m=document.getElementById("midadBootError");
  if(b&&m){m.textContent="JavaScript: "+(e.message||"Unknown error")+" · "+(e.filename||"inline")+" : "+(e.lineno||"—");b.style.display="block";}
});
window.addEventListener("unhandledrejection",function(e){
  if(window.__MIDAD_V16_READY)return;
  var b=document.getElementById("midadBootGuard"),m=document.getElementById("midadBootError"),r=e&&e.reason;
  if(b&&m){m.textContent="Promise: "+((r&&r.message)||String(r||"Unknown rejection"));b.style.display="block";}
});
(function(){
  var s=document.createElement("script");
  s.src="./midad-control-v16.js?v=20260926a";s.async=false;
  s.onerror=function(){document.getElementById("midadBootGuard").style.display="block";document.getElementById("midadBootError").textContent="تعذر تحميل midad-control-v16.js من GitHub Pages."};
  document.head.appendChild(s);
})();
if("serviceWorker" in navigator){window.addEventListener("load",function(){navigator.serviceWorker.register("./service-worker.js").catch(function(){})})}
</script>
</body>
</html>
