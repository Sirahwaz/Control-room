448	    box.innerHTML=`<h3>${esc(title)}</h3><p>هذا السجل المحلي لا يرسل أموالاً ولا يغير النظام. لا تدخل seed phrase أو private key.</p><div class="form-grid">${fields.map(f=>`<div class="field"><label>${esc(f[1])}</label><input id="mf_${f[0]}" type="${f[2]||'text'}"></div>`).join('')}</div><div style="display:flex;justify-content:flex-end;gap:8px;margin-top:14px"><button class="btn" id="modalCancel">إلغاء</button><button class="btn btn-primary" id="modalSave">حفظ</button></div>`; 
449	    modal.classList.add('open'); 
450	    document.getElementById('modalCancel').onclick=()=>modal.classList.remove('open'); 
451	    document.getElementById('modalSave').onclick=()=>{ if(kind==='wallet'){state.personal.wallets.push({label:v('label'),address:v('address'),network:v('network')});} else if(kind==='income'){state.personal.income.push({title:v('title'),amount:Number(v('amount')||0),createdAt:Date.now()});} else if(kind==='trade'){state.personal.paperTrades.push({asset:v('asset'),side:v('side'),entry:v('entry'),stop:v('stop'),target:v('target')});} else { toast('السجل حُفِظ كمخطط محلي.','good'); } 
452	      saveLocal(); modal.classList.remove('open'); render(); 
453	    }; 
454	    function v(k){return document.getElementById('mf_'+k)?.value.trim()||'';} 
455	  }

457	  function toast(msg,type='good'){ 
458	    const stack=document.getElementById('toastStack');if(!stack)return;const el=document.createElement('div');el.className=`toast ${type}`;el.textContent=msg;stack.appendChild(el);setTimeout(()=>el.remove(),4200); 
459	  }

461	  async function connect(){ 
462	    const tg = window.Telegram?.WebApp?.initData || ''; 
463	    const access = (document.getElementById('accessKey')?.value || state.accessKey || '').trim(); 
464	    state.accessKey = access; 
465	    const url=(CFG.supabaseUrl||'')+(CFG.controlRoomFunction||''); 
466	    if(!url){toast('Supabase URL/function غير مضبوطين.','bad');return;} 
467	    const body={action:CFG.dashboardAction||'dashboard',telegram_init_data:tg,access_key:access}; 
468	    try{ 
469	      const res=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}); 
470	      const data=await res.json().catch(()=>({})); 
471	      if(!res.ok) throw new Error(data?.error||data?.message||`HTTP ${res.status}`); 
472	      state.connected=true;state.connectionLabel='متصل ومُتحقق';state.lastProbe=Date.now();state.live=data?.dashboard||data?.data||data||{}; 
473	      const u=state.live?.user||data?.user||{}; state.user={name:u.name||u.full_name||'',email:u.email||'',telegram:u.telegram||u.username||''}; 
474	      render();toast('تم التحقق من اتصال غرفة التحكم.','good'); 
475	    }catch(err){ state.connected=false;state.connectionLabel='Degraded / غير متصل';state.live=null;render();toast(`تعذر التحقق من الاتصال: ${err.message}`,'warn'); } 
476	  } 
477	 
478	  function boot(){ 
479	    const hash=(location.hash||'').replace('#','');if(routes.some(r=>r[0]===hash))state.route=hash; 
480	    if(window.Telegram?.WebApp){ try{window.Telegram.WebApp.ready();window.Telegram.WebApp.expand();}catch{} } 
481	    render(); 
482	    setTimeout(()=>APP.classList.remove('is-loading'),40); 
483	    if(window.Telegram?.WebApp?.initData){ setTimeout(()=>connect(),120); } 
484	  } 
485	  window.addEventListener('hashchange',()=>{const h=(location.hash||'').slice(1);if(routes.some(r=>r[0]===h)){state.route=h;render();}}); 
486	  boot(); 
487	})();
